life?\n\nHad I wealth and love in fullest measure,\nWith a name renowned both far and near,\nYet no hope beyond, no harbour waiting,\nWhere my storm-tossed vessel I could steer;\nIf I gained the world, but lost the Saviour,\nWho endured the cross and died for me,\nould then all the world afford a refuge\nWhither in my anguish I might flee?\n\nO what emptiness! without the Saviour\n'Mid the sins and sorrows here below!\nAnd eternity, how dark without Him;\nOnly night and tears and endless woe!\nWhat though I might live without the Saviour,\nWhen I come to die, how would it be?\nO to face the valley's gloom without Him!\nAnd without Him for eternity!\n\nO the joy of having all in Jesus!\nWhat a balm the broken heart to heal!\nNe'er a sin so great, but He can cleanse it,\nNot a sorrow that He does not feel!\nIf I have but Jesus, only Jesus,\nNothing else in all the world beside,\nO then everything is mine in Jesus;\nFor my needs and more He will provide.","category":"main","id":"70","author":"Anna Olander","year":"1904","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anna Olander, 1904. Copyright status should be verified."},{"number":"71","title":"If You Know The Lord","lyrics":"If you know the Lord, you need nobody else\nTo see you through the darkest night.\nYou can walk alone, you only need the Lord,\nHe'll keep you on the road marked right.\nTake time to pray, every day;\nAnd when you're heading home, He'll show you the way.\nIf you know the Lord, you need nobody else\nTo see the light, His wonderful light.","category":"main","id":"71","author":"Anonymous","year":"c. 1950s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1950s. Copyright status should be verified."},{"number":"72","title":"Mansion Over The Hilltop","lyrics":"I'm satisfied with just a cottage below,\nA little silver and a little gold;\nBut in that city where the ransomed will shine,\nI want a gold one that's silver-lined.\n\nChorus:\nI've got a mansion just over the hilltop,\nIn that bright land where we'll never grow old;\nAnd some day yonder we will nevermore wander,\nBut walk the streets that are purest gold.\n\nThough often tempted, tormented and tested,\nAnd like the prophet, my pillow a stone;\nAnd though I find here no permanent dwelling,\nI know He'll give me a mansion my own.\n\nDon't think me poor or deserted or lonely,\nI'm not discouraged, I'm heaven-bound;\nI'm just a pilgrim in search of a city,\nI want a mansion, a harp and a crown.","category":"main","id":"72","author":"Ira F. Stanphill","year":"1949","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Ira F. Stanphill, 1949. Copyright status should be verified."},{"number":"73","title":"I'M Waiting For Thee, Lord","lyrics":"I'm waiting for Thee, Lord, Thy beauty to see, Lord,\nI'm waiting for Thee, for Thy coming again.\nThou'rt gone over there, Lord, a place to prepare, Lord,\nThy home I shall share at Thy coming again.\n\n'Mid danger and fear, Lord, I'm oft weary here, Lord,\nThe day must be near of Thy coming again.\n'Tis all sunshine there, Lord, no sighing nor care, Lord,\nBut glory so fair at Thy coming again.\n\nE'en now let my ways, Lord, be bright with Thy praise, Lord,\nFor brief are the days ere Thy coming again.\nI'm waiting for Thee, Lord, Thy beauty to see, Lord,\nNo triumph for me like Thy coming again.","category":"main","id":"73","author":"S. Trevor Francis","year":"c. 1870","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by S. Trevor Francis, c. 1870. Copyright status should be verified."},{"number":"74","title":"The Stranger Of Galilee","lyrics":"In fancy I stood by the shore, one day,           I heard Him speak peace to the angry waves\nOf the beautiful murmuring sea:                   Of that turbulent, raging sea;\nI saw the great crowds as they thronged the way   And lo! at His word are the waters stilled,\nOf the Stranger of Galilee;                       This Stranger of Galilee.\nI saw how the man who was blind from birth,       A peaceful, a quiet, a holy calm,\nIn a moment was made to see;                      Now and ever abides with me;\nThe lame was made whole by the matchless skill    He holdeth my life in His mighty hands,\nOf the Stranger of Galilee.                       This Stranger of Galilee.\n\nAnd I felt I could love Him forever,              Come ye, who are driven, and tempest-tossed,\nSo gracious and tender was He!                    And His gracious salvation see;\nI claimed Him that day as my Saviour,             He'll quiet life's storms with His \"Peace, be still!\"\nThis Stranger of Galilee.                         This Stranger of Galilee;\n\nChorus:\nHe bids me to go and the story tell\n\nHis look of compassion, His words of love,        What He ever to you will be,\nThey shall never forgotten be,                    If only you let Him with you abide,\nWhen sin-sick and helpless He saw me there,       This Stranger of Galilee.\nThis Stranger of Galilee;\nHe showed me His hands and His riven side,             Oh, my friend, won't you love Him forever?\nAnd He whispered, \"It was for thee!\"                   So gracious and tender is He!\nMy burden fell off at the pierced feet                 Accept Him today as your Saviour,\nOf the Stranger of Galilee.                            This Stranger of Galilee.","category":"main","id":"74","author":"Lelia N. Morris","year":"1905","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Lelia N. Morris, 1905. Copyright status should be verified."},{"number":"75","title":"His Sheep Am I","lyrics":"In God's green pastures feeding, by His cool waters lie,\nSoft in the evening walk my Lord and I;\nAll the sheep of His pasture fare so wondrously fine -- His sheep am I.\n\nWaters cool ... (In the valley)...\nPastures green ... (On the mountain)...\nIn the eve... (In the eve...)...ning walk my Lord and I;\nDark the night... (In the valley) ...\nRough the way... (On the mountain) ...\nStep by step... (Step by step) ... My Lord and I.\n\nYes the Lord is my shepherd and no want shall I know,\nHe\u2019ll guide and comfort me where \u2018er I go;\nOn the mount, in the valley, by his hand will he lead\nHis sheep am I","category":"main","id":"75","author":"Orien Johnson","year":"1956","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Orien Johnson, 1956. Copyright status should be verified."},{"number":"76","title":"In Heavenly Love Abiding","lyrics":"In heavenly love abiding, no change my heart shall fear,\nAnd safe in such confiding, for nothing changes here.\nThe storm may roar without me, my heart may low be laid,\nBut God is round about me, and can I be dismayed?\n\nWherever He may guide me, no want shall turn me back;\nMy Shepherd is beside me, and nothing can I lack.\nHis wisdom ever waketh, His sight is never dim,\nHe knows the way He taketh, and I will walk with Him.\n\nGreen pastures are before me, which yet I have not seen,\nBright skies will soon be o'er me where the dark clouds had been.\nMy hope I cannot measure, my path to life is free,\nMy Saviour has my treasure, and He will walk with me.\n\nEre yet another morning my spirit may be free,\nAs absent from the body, at home, O Lord, with Thee.\nO sleep, O rest, how precious! As, guarded by Thy care,\nI'm waiting for Thy promise to meet Thee in the air!\n\nThe Lord Himself, e'en Jesus, amid the ransomed throng,\nIts glory, joy, and beauty, its never-ending song.\nO day of wondrous promise, the Bridegroom and the bride\nAre seen in glory ever; forever satisfied!","category":"main","id":"76","author":"Anna L. Waring","year":"1850","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anna L. Waring, 1850. Copyright status should be verified."},{"number":"77","title":"He Lifted Me","lyrics":"In loving-kindness Jesus came\nMy soul in mercy to reclaim,\nAnd from the depths of sin and shame\nThrough grace He lifted me.\n\nChorus:\nFrom sinking sand He lifted me,\nWith tender hand He lifted me,\nFrom shades of night to plains of light,\nO praise His name, He lifted me!\n\nHe called me long before I heard,\nBefore my sinful heart was stirred,\nBut when I took Him at His word,\nForgiven He lifted me.\n\nHis brow was pierced with many a thorn,\nHis hands by cruel nails were torn,\nWhen from my guilt and grief, forlorn,\nIn love He lifted me.\n\nNow on a higher plain I dwell,\nAnd with my soul I know 'tis well;\nYet how or why, I cannot tell,\nHe should have lifted me.","category":"main","id":"77","author":"Charles H. Gabriel","year":"1905","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charles H. Gabriel, 1905. Copyright status should be verified."},{"number":"78","title":"In Tenderness He Sought Me","lyrics":"In tenderness He sought me, weary and sick with sin,\nAnd on His shoulders brought me back to\nHimself again, While tidings of the lost one found\nMade heaven's courts with praise resound.\n\nChorus:\nOh, the love that sought me!\nOh, the blood that bought me!\nOh, the grace that brought me to Himself,\nWondrous grace that brought me to Himself!\n\nHe washed the bleeding sin-wounds, and poured in oil and wine;\nHe whispered to assure me, \"I've found thee, thou art Mine;\"\nI never heard a sweeter voice,\nIt made my aching heart rejoice.\n\nHe pointed to the nail-prints; for me His blood was shed,\nA mocking crown so thorny was placed upon His head;\nI wondered what He saw in me\nTo suffer such deep agony.\n\nI'm sitting in His presence, the sunshine of His face,\nWhile with adoring wonder His blessings I retrace.\nIt seems as if eternal days\nAre far too short to sing His praise.\n\nSo while the hours are passing, all now is perfect rest;\nI'm waiting for the morning, the brightest and the best,\nWhen He will call me to His side,\nThe portion of His spotless bride.","category":"main","id":"78","author":"W. Spencer Walton","year":"1894","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by W. Spencer Walton, 1894. Copyright status should be verified."},{"number":"79","title":"In The Secret Of His Presence","lyrics":"In the secret of His presence how my soul delights to hide!\nOh, how precious are the lessons which I learn at Jesus' side!\nEarthly cares can never vex me, neither trials lay me low:\nFor when Satan comes to tempt me, to the secret place I go,\nTo the secret place I go.\n\nWhen my soul is faint and thirsty, 'neath the shadow of His wing\nThere is cool and pleasant shelter, and a fresh and crystal spring;\nAnd my Saviour rests beside me, as we hold communion sweet:\nIf I tried, I could not utter what He says when thus we meet,\nWhat He says when thus we meet.\n\nOnly this I know: I tell Him all my doubts, and griefs, and fears;\nOh, how patiently He listens! and my drooping soul He cheers:\nDo you think He ne'er reproves me? What a false friend He would be\nIf He never, never told me of the sins which He must see,\nOf the sins which He must see.\n\nWould you like to know the sweetness of the secret of the Lord?\nGo and hide beneath His shadow; this shall then be your reward,\nAnd whene'er you leave the silence of that happy meeting-place,\nYou will bear the shining image of the Master in your face,\nOf the Master in your face.","category":"main","id":"79","author":"Ellen L. Goreh","year":"1883","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Ellen L. Goreh, 1883. Copyright status should be verified."},{"number":"80","title":"It May Be At Morn","lyrics":"It may be at morn, when the day is awaking,\nWhen sunlight through darkness and shadow is breaking,\nThat Jesus will come in the fulness of glory,\nTo receive from the world His own.\n\nChorus:\nO Lord Jesus, how long? How long\nEre we shout the glad song?\nChrist returneth; Hallelujah! Hallelujah! Amen.\nHallelujah! Amen.\n\nIt may be at midday, it may be at twilight,\nIt may be, perchance, that the blackness of midnight\nWill burst into light in the blaze of His glory,\nWhen Jesus receives His own.\n\nO, joy! O, delight! should we go without dying;\nNo sickness, no sadness, no dread and no crying;\nCaught up through the clouds with our Lord into glory,\nWhen Jesus receives His own.","category":"main","id":"80","author":"H.L. Turner","year":"1878","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by H.L. Turner, 1878. Copyright status should be verified."},{"number":"81","title":"Pass It On","lyrics":"It only takes a spark to get a fire going,\nAnd soon all those around can warm up in its glowing.\nThat's how it is with God's love: once you've experienced it,\nYou spread His love to everyone; you want to pass it on.\n\nWhat a wondrous time is spring when all the trees are budding,\nThe birds begin to sing, the flowers start their blooming.\nThat's how it is with God's love: once you've experienced it,\nYou want to sing; it's fresh like spring, you want to pass it on.\n\nI wish for you, my friend, this happiness that I've found.\nYou can depend on Him, it matters not where you're bound.\nI'll shout it from the mountain top; I want the world to know:\nThe Lord of Love has come to me, I want to pass it on.","category":"main","id":"81","author":"Kurt Kaiser","year":"1969","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Kurt Kaiser, 1969. Copyright status should be verified."},{"number":"82","title":"It Passeth Knowledge","lyrics":"It passeth knowledge! that dear love of Thine,      I am an empty vessel -- scarce one thought\nMy Jesus! Saviour! yet this soul of mine            Or look of love to Thee I've ever brought;\nWould of Thy love, in all its breadth and length,   Yet I may come, and come again to Thee\nIts height and depth and everlasting strength,      With this, the needy children's only plea --\nKnow more and more.                                 \"Thou lovest me!\"\n\nIt passeth telling! that dear love of Thine,        O fill me, Jesus, Saviour, with Thy love;\nMy Jesus! Saviour! yet these lips of mine           Lead, lead me to the living fount above!\nWould fain proclaim to sinners far and near         Thither may I in simple faith draw nigh\nA love which can remove all guilty fear,            And never to another fountain fly,\nAnd love beget.                                     But unto Thee.\n\nIt passeth praises! that dear love of Thine,        And Jesus, when Thee face to face I see,\nMy Jesus! Saviour! yet this heart of mine           When on Thy lofty throne I sit with Thee;\nWould sing a love so rich -- so full -- so free,    Then of Thy love in all its breadth and length,\nWhich brought a rebel sinner, such as me,           Its height and depth, its everlasting strength,\nNigh unto God.                                      My soul shall sing.\n\nBut though I cannot tell or sing or know\nThe fulness of Thy love while here below,\nMy empty vessel I may freely bring --\nO Thou who art of love the living spring,\nMy vessel fill.","category":"main","id":"82","author":"Mary Shekleton","year":"1863","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Mary Shekleton, 1863. Copyright status should be verified."},{"number":"83","title":"Alone","lyrics":"It was alone the Saviour prayed in dark Gethsemane;\nAlone He faced the bitter cup in agony for me.\n\nChorus:\nAlone, alone, He bore it all alone;\nHe gave Himself to save His own,\nHe suffered, bled and died alone, alone.\n\nIt was alone the Saviour stood in Pilate's judgment hall;\nAlone the crown of thorns He wore, forsaken thus by all.\n\nAlone upon the cross He hung that others He might save;\nForsaken then by God and man, alone, His life He gave.\n\nCan you reject such matchless love? Can you His claim disown?\nCome, give your all in gratitude, nor leave Him thus alone.","category":"main","id":"83","author":"Ben H. Price","year":"1913","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Ben H. Price, 1913. Copyright status should be verified."},{"number":"84","title":"It'S Not An Easy Road","lyrics":"It's not an easy road we are travelling to heaven,\nFor many are the thorns on the way;\nIt's not an easy road but the Saviour is with us,\nHis presence gives us joy every day.\n\nChorus:\nNo, no, it's not an easy road,\nNo, no, it's not an easy road;\nBut Jesus walks beside me and brightens the journey,\nAnd lightens every heavy load.\n\nIt's not an easy road, there are trials and troubles,\nAnd many are the dangers we meet;\nBut Jesus guards and keeps so that nothing can harm us,\nAnd smooths the rugged path for our feet.\n\nThough I am often footsore and weary from travel,\nThough I am often bowed down with care;\nA better day is coming when, home in the glory,\nWe'll rest in perfect peace over there.","category":"main","id":"84","author":"Anonymous/Traditional","year":"c. 1950s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Traditional, c. 1950s. Copyright status should be verified."},{"number":"85","title":"Lord, I'M Coming Home","lyrics":"I've wandered far away from God, now I'm coming home;\nThe paths of sin too long I've trod, Lord, I'm coming home.\n\nChorus:\nComing home, coming home, nevermore to roam.\nOpen wide Thine arms of love, Lord, I'm coming home.\n\nI've wasted many precious years, now I'm coming home;\nI now repent with bitter tears, Lord, I'm coming home.\n\nI've tired of sin and straying, Lord, now I'm coming home;\nI'll trust Thy love, believe Thy word, Lord, I'm coming.\n\nMy soul is sick, my heart is sore, now I'm coming home;\nMy strength renew, my hope restore, Lord, I'm coming home.","category":"main","id":"85","author":"William J. Kirkpatrick","year":"1892","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by William J. Kirkpatrick, 1892. Copyright status should be verified."},{"number":"86","title":"Lovely Art Thou To Me","lyrics":"Jesus, my Lord, who died on the cross,\nLovely art Thou to me;\nSilver and gold -- I count them but dross;\nNought can compare with Thee.\n\nWhat are earth's joys, so fleeting and vain,\nJesus, my Lord, to me!\nSweeter by far is the heavenly gain;\nLovely art Thou to me.\n\nStorms may assail, my bark may be tossed,\nVoyaging o'er life's sea;\nThou, Lord, art near, I cannot be lost,\nRefuge art Thou to me.\n\nJesus, my Lord, 'twas sin's heavy load,\nThe curse that was borne by Thee;\nStroke upon stroke, as God's wrath awoke,\nFell upon Thee for me.\n\nJesus, my Lord, what oceans of love\nStirred in Thy heart for me!\nJesus, my Lord, in glory above,\nLovely art Thou to me.","category":"main","id":"86","author":"Anonymous/Brethren","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Brethren, c. 1900. Copyright status should be verified."},{"number":"87","title":"Now I Belong To Jesus","lyrics":"Jesus my Lord will love me forever,\nFrom Him no power of evil can sever,\nHe gave His life to ransom my soul,\nNow I belong to Him.\n\nChorus:\nNow I belong to Jesus, Jesus belongs to me,\nNot for the years of time alone, but for eternity.\n\nOnce I was lost in sin's degradation,\nJesus came down to bring me salvation,\nLifted me up from sorrow and shame,\nNow I belong to Him.\n\nJoy floods my soul for Jesus has saved me,\nFreed me from sin that long had enslaved me,\nHis precious blood He gave to redeem,\nNow I belong to Him.","category":"main","id":"87","author":"Norman J. Clayton","year":"1943","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Norman J. Clayton, 1943. Copyright status should be verified."},{"number":"88","title":"Just As I Am","lyrics":"Just as I am -- without one plea,\nBut that Thy blood was shed for me,\nAnd that Thou bidst me come to Thee:\nO Lamb of God, I come! I come!\n\nJust as I am -- and waiting not\nTo rid my soul of one dark blot,\nTo Thee, whose blood can cleanse each spot:\nO Lamb of God, I come! I come!\n\nJust as I am -- poor, wretched, blind,\nSight, riches, healing of the mind,\nYea, all I need in Thee to find:\nO Lamb of God, I come! I come!\n\nJust as I am -- Thou wilt receive,\nWilt welcome, pardon, cleanse, relieve;\nBecause Thy promise I believe:\nO Lamb of God, I come! I come!\n\nJust as I am -- Thy love, I own,\nHas broken every barrier down:\nNow to be Thine, yea, Thine alone,\nO Lamb of God, I come! I come!","category":"main","id":"88","author":"Charlotte Elliott","year":"1835","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charlotte Elliott, 1835. Copyright status should be verified."},{"number":"89","title":"Let'S Talk About Jesus","lyrics":"Let's talk about Jesus, the King of kings is He;\nThe Lord of lords supreme, through all eternity.\nThe Great I AM, The Way, The Truth, The Life, The Door,\nLet's talk about Jesus more and more.\n\nIsn't He wonderful, wonderful, wonderful,\nIsn't Jesus my Lord wonderful?\nEyes have seen, ears have heard, it's recorded in God's\nWord, Isn't Jesus my Lord wonderful?\n\nWonderful, wonderful, Jesus is to me.\nCounsellor, Prince of Peace, Mighty God is He.\nSaving me, keeping me, from all sin and shame;\nWonderful is my Redeemer! Praise His name!\n\nHe is Lord, He is Lord,\nHe is risen from the dead, He is Lord.\nEvery knee shall bow, every tongue confess\nThat Jesus Christ is Lord.\n\nHis name is wonderful. His name is wonderful.\nHis name is wonderful, Jesus my Lord.\nHe is the Mighty King, Master of everything;\nHis name is wonderful, Jesus my Lord.\n\nHe's the Great Shepherd, the Rock of all ages,\nAlmighty God is He.\nBow down before Him, praise and adore Him,\nHis name is wonderful, Jesus my Lord.\n\nWonderful, wonderful, wonderful, wonderful,\nIsn't Jesus my Lord wonderful?\nWe shall see, we shall hear for His coming draweth near,\nEvermore we shall say, \"Wonderful!\"","category":"main","id":"89","author":"Anonymous","year":"c. 1950s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1950s. Copyright status should be verified."},{"number":"90","title":"Life Is Like A Mountain Railroad","lyrics":"Life is like a mountain railroad, with an engineer that's brave;\nWe must make the run successful, from the cradle to the grave;\nWatch the curves, the fills, the tunnels; never falter, never quail;\nKeep your hand upon the throttle, and your eye upon the rail.\n\nChorus:\nBlessed Saviour, Thou wilt guide us till we reach that blissful shore;\nWhere the angels wait to join us in Thy praise forevermore.\n\nYou will roll up grades of trial; you will cross the bridge of strife;\nSee that Christ is your conductor on this lightning train of life;\nAlways mindful of obstruction, do your duty, never fail;\nKeep your hand upon the throttle, and your eye upon the rail.\n\nYou will often find obstructions; look for storms of wind and rain;\nOn a fill, or curve, or trestle, they will almost ditch your train;\nPut your trust alone in Jesus; never falter, never fail;\nKeep your hand upon the throttle, and your eye upon the rail.","category":"main","id":"90","author":"M.E. Abbey","year":"1890","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by M.E. Abbey, 1890. Copyright status should be verified."},{"number":"91","title":"Like A River Glorious","lyrics":"Like a river glorious is God's perfect peace,\nOver all victorious in its bright increase;\nPerfect, yet it floweth fuller every day,\nPerfect, yet it groweth deeper all the way.\n\nChorus:\nStayed upon Jehovah hearts are fully blest;\nFinding, as He promised, perfect peace and rest.\n\nHidden in the hollow of His blessed hand,\n\u2018Never foe can follow, never traitor stand;\nNot a surge of worry, not a shade of care,\nNot a blast of hurry move the spirit there.\n\nEvery joy or trial falleth from above,\nTraced upon our dial by the Sun of Love;\nWe may trust Him fully all for us to do:\nThey who trust Him wholly, find Him wholly true.","category":"main","id":"91","author":"Frances R. Havergal","year":"1876","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Frances R. Havergal, 1876. Copyright status should be verified."},{"number":"92","title":"Fill My Cup, Lord","lyrics":"Like the woman at the well I was seeking\nFor things that did not satisfy,\nAnd then I heard my Saviour speaking:\n\"Draw from My well that never shall run dry.\"\n\nChorus:\nFill my cup, Lord, I lift it up, Lord,\nCome and quench this thirsting of my soul.\nBread of Heaven, feed me till I want no more;\nFill my cup, fill it up and make me whole.\n\nThere are millions in this world who are craving\nThe pleasure earthly things afford,\nBut none can match the wondrous treasure\nThat I find in Jesus Christ my Lord.\n\nSo my brother if the things this world gave you\nLeave hungers that won't pass away,\nMy blessed Lord will come and save you\nIf you kneel to Him and humbly pray:","category":"main","id":"92","author":"Richard Blanchard","year":"1959","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Richard Blanchard, 1959. Copyright status should be verified."},{"number":"93","title":"Living For Jesus","lyrics":"Living for Jesus a life that is true,\nStriving to please Him in all that I do,\nYielding allegiance, glad-hearted and free,\nThis is the pathway of blessing for me.\n\nChorus:\nO Jesus, Lord and Saviour, I give myself to Thee;\nFor Thou, in Thy atonement, didst give Thyself for me.\nI own no other Master, my heart shall be Thy throne,\nMy life I give, henceforth to live, O Christ, for Thee alone.\n\nLiving for Jesus who died in my place,\nBearing on Calvary my sin and disgrace,\nSuch love constrains me to answer His call,\nFollow His leading and give Him my all.\n\nLiving for Jesus through earth's little while,\nMy dearest treasure, the light of His smile,\nSeeking the lost ones He died to redeem,\nBringing the weary to find rest in Him.","category":"main","id":"93","author":"Thomas O. Chisholm","year":"1917","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Thomas O. Chisholm, 1917. Copyright status should be verified."},{"number":"94","title":"Long Did I Toil","lyrics":"Long did I toil, and knew no earthly rest;\nFar did I rove, and found no certain home;\nAt last I sought them in His sheltering breast,\nWho opes His arms, and bids the weary come;\nWith Him I found a home, a rest divine,\nAnd I since then am His, and He is mine.\n\nThe good I have is from His stores supplied;\nThe ill is only what He deems the best;\nHe for my Friend, I'm rich with nought beside;\nAnd poor without Him, though of all possessed.\nChanges may come; I take, or I resign;\nContent, while I am His, while He is mine.\n\nWhile here, alas! I know but half His love,\nBut half discern Him, and but half adore,\nBut when I meet Him in the realms above,\nI then will love Him better, praise Him more,\nAnd feel, and tell, amid the choir divine,\nHow fully I am His, and He is mine.","category":"main","id":"94","author":"Horatius Bonar","year":"c. 1850","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Horatius Bonar, c. 1850. Copyright status should be verified."},{"number":"95","title":"Lord Jesus, I Love Thee","lyrics":"Lord Jesus, I love Thee, I know Thou art mine,\nMy Rock and my Fortress, my Surety divine,\nMy gracious Redeemer, my song shall be now:\n'Tis Thou who art worthy, Lord Jesus, 'tis Thou.\n\nI love Thee because Thou hast first loved me,\nAnd purchased my pardon on Calvary's tree;\nI love Thee for wearing the thorns on Thy brow:\n'Tis Thou who art worthy, Lord Jesus, 'tis Thou.\n\nI'd love Thee in life, I would love Thee in death,\nAnd praise Thee as long as Thou lendest me breath,\nAnd sing, should the death-dew lie cold on my brow:\n'Tis Thou who art worthy, Lord Jesus, 'tis Thou.\n\nAnd when the bright morn of Thy glory shall come,\nAnd children ascend to the Father's glad home,\nI'll shout, with Thy likeness impressed on my brow:\n'Tis Thou who art worthy, Lord Jesus, 'tis Thou.","category":"main","id":"95","author":"Anonymous","year":"c. 1860s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1860s. Copyright status should be verified."},{"number":"96","title":"Lead Me To Calvary","lyrics":"Lord of my life, I'd crown Thee now; Thine shall the glory be;\nLest I forget Thy thorn-crowned brow, lead me to Calvary.\n\nChorus:\nLest I forget Gethsemane, lest I forget Thine agony,\nLest I forget Thy love for me, lead me to Calvary.\n\nSaviour and Lord Thy love I own, greater it could not be;\nKeep me with eye of faith above, waiting Thy face to see.\n\nWhen I shall see Thee face to face, happy I then shall be;\nOh what a day, for this I wait, Jesus will come for me.","category":"main","id":"96","author":"Jennie E. Hussey","year":"1921","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Jennie E. Hussey, 1921. Copyright status should be verified."},{"number":"97","title":"Love Divine, All Praise Excelling","lyrics":"Love divine, all praise excelling, joy of heaven, to earth come down,\nBless us with Thy rich indwelling, all Thy faithful mercies crown! Saviour,\nThee we'd still be blessing, serve Thee here, as soon above;\nPraise Thee, Saviour, without ceasing, glory in Thy dying love.\n\nFirstfruits of Thy new creation -- faithful, holy, may we be,\nJoyful in Thy full salvation, more and more conformed to Thee.\nChanged from glory into glory, till in heaven we take our place,\nThen to worship and adore Thee, lost in wonder, love, and praise!","category":"main","id":"97","author":"Charles Wesley","year":"1747","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charles Wesley, 1747. Copyright status should be verified."},{"number":"98","title":"Love Not The World","lyrics":"Love not the world: its smiles, its hopes may lure thee on,\nBut cup of joy, and dream of bliss, will soon be gone.\nThose dreams will fade, as mist in morn; those hopes will die;\nAnd in that cup of seeming joy, deep sorrows lie.\n\nLove not the world: it, with its lusts, must pass away;\nIts pleasures sweet, its hopes so bright, must all decay.\nIts glories, too, must have an end, must pale and die,\nAnd all its empty bubbles burst; they're Satan's lie.\n\nBut he who does the will of God, for aye will live,\nAnd drink the streams of heaven's delights, which Christ will give.\nHe'll weep no more on that blest shore; no marvel this,\nFor joys well up, and fill his cup; there's naught but bliss.\n\nDear fellow-pilgrim in the path, look up! look on!\nThere waits above a home of love, where Christ is gone.\nAnd pleasures bright in courts of light will satisfy\nA heart at rest, supremely blest, with Jesus nigh.","category":"main","id":"98","author":"J.N. Darby","year":"c. 1850","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by J.N. Darby, c. 1850. Copyright status should be verified."},{"number":"99","title":"Why Should He Love Me So?","lyrics":"Love sent my Saviour to die in my stead,\nWhy should He love me so?\nMeekly to Calvary's cross He was led,\nWhy should He love me so?\n\nChorus:\nWhy should He love me so?\nWhy should He love me so?\nWhy should my Saviour to Calvary go?\nWhy should He love me so?\n\nNails pierced His hands and His feet for my sin,\nWhy should He love me so?\nHe suffered sore my salvation to win,\nWhy should He love me so?\n\nO how He agonized there in my place,\nWhy should He love me so?\nNothing withholding my sin to efface,\nWhy should He love me so?","category":"main","id":"99","author":"Robert Harkness","year":"1917","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Robert Harkness, 1917. Copyright status should be verified."},{"number":"100","title":"He Arose","lyrics":"Low in the grave He lay -- Jesus, my Saviour!\nWaiting the coming day -- Jesus, my Lord!\n\nChorus:\nUp from the grave He arose\nWith a mighty triumph o'er His foes;\nHe arose a Victor from the dark domain,\nAnd He lives forever with His saints to reign!\nHe arose! He arose! Hallelujah! Christ arose!\n\nVainly they watch His bed -- Jesus, my Saviour!\nVainly they seal the dead -- Jesus, my Lord!\n\nDeath cannot keep his prey -- Jesus, my Saviour!\nHe tore the bars away -- Jesus, my Lord!","category":"main","id":"100","author":"Robert Lowry","year":"1874","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Robert Lowry, 1874. Copyright status should be verified."},{"number":"101","title":"Majesty","lyrics":"Majesty, worship His Majesty.\nUnto Jesus be all glory, honour and praise.\nMajesty, kingdom authority,\nFlow from His throne unto His own; His anthem raise.\n\nSo exalt, lift up on high the Name of Jesus;\nMagnify, come glorify Christ Jesus the King.\nMajesty, worship His Majesty.\nJesus who died now glorified, King of all Kings.","category":"main","id":"101","author":"Jack Hayford","year":"1981","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Jack Hayford, 1981. Copyright status should be verified."},{"number":"102","title":"Hallelujah, What A Saviour!","lyrics":"\"Man of Sorrows,\" what a name for the Son of God who came\nRuined sinners to reclaim! Hallelujah! what a Saviour!\n\nBearing shame and scoffing rude, in my place condemned He stood;\nSealed my pardon with His blood; Hallelujah! what a Saviour!\n\nGuilty, vile and helpless we; spotless Lamb of God was He;\n\"Full atonement\" can it be? Hallelujah! what a Saviour!\n\nLifted up was He to die, \"It is finished,\" was His cry;\nNow in heaven exalted high; Hallelujah! what a Saviour!\n\nWhen He comes, our glorious King, all His ransomed home to bring,\nThen anew this song we'll sing: Hallelujah! what a Saviour!","category":"main","id":"102","author":"Philip P. Bliss","year":"1875","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Philip P. Bliss, 1875. Copyright status should be verified."},{"number":"103","title":"Grace Greater Than Our Sin","lyrics":"Marvelous grace of our loving Lord,\nGrace that exceeds our sin and our guilt,\nYonder on Calvary's mount outpoured,\nThere where the blood of the Lamb was spilt.\n\nChorus:\nGrace, grace, God's grace,\nGrace that will pardon and cleanse within.\nGrace, grace, God's grace,\nGrace that is greater than all our sin.\n\nSin and despair like the sea waves cold\nThreaten the soul with infinite loss;\nGrace that is greater, yes, grace untold\nPoints to the Refuge, the mighty cross.\n\nDark is the stain that we cannot hide,\nWhat can avail to wash it away?\nLook! there is flowing a crimson tide;\nWhiter than snow you may be today.\n\nMarvelous, infinite, matchless grace,\nFreely bestowed on all who believe;\nYou that are wandering from His face,\nWill you this moment His grace receive?","category":"main","id":"103","author":"Julia H. Johnston","year":"1911","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Julia H. Johnston, 1911. Copyright status should be verified."},{"number":"104","title":"Mighty, Mighty Love Of Jesus","lyrics":"Mighty, mighty love of Jesus!\nGreater love was never known;\nLove that stooped from heights of glory,\nLove that left for me, a throne.\n\nChorus:\nPrecious, priceless love of Jesus! All sufficient 'tis for me;\nAll my sins and all my sorrows fully met at Calvary.\n\nWondrous, wondrous love of Jesus!\nOnce for me He lived a child;\nLowly Son of lowly mother\nHe, the Christ, the Undefiled!\n\nFaithful, faithful love of Jesus!\nCounting everything but loss;\nUnto death for me submitting,\nEven death upon the cross!\n\nConquering, conquering love of Jesus!\nVictor o'er the sealed grave!\nTrampling down the hosts of darkness,\nFrom their power my soul to save.\n\nTender, tender love of Jesus!\nAt the Father's side He stands,\nInterceding for me always,\nHolding up His pierced hands!\n\nPerfect, perfect love of Jesus!\nIn its fulness let me hide,\nTill the King in all His beauty\nComes to claim His spotless bride.","category":"main","id":"104","author":"Anonymous","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1900. Copyright status should be verified."},{"number":"105","title":"More About Jesus","lyrics":"More about Jesus would I know,\nMore of His grace to others show,\nMore of His saving fulness see,\nMore of His love who died for me.\n\nChorus:\nMore, more about Jesus;\nMore, more about Jesus;\nMore of His saving fulness see;\nMore of His love who died for me.\n\nMore about Jesus let me learn,\nMore of His holy will discern;\nSpirit of God, my teacher be,\nShowing the things of Christ to me.\n\nMore about Jesus in His Word,\nHolding communion with my Lord,\nHearing His voice in every line,\nMaking each faithful saying mine.\n\nMore about Jesus on His throne,\nRiches in glory all His own,\nMore of His kingdom's sure increase,\nMore of His coming Prince of Peace.","category":"main","id":"105","author":"Eliza E. Hewitt","year":"1887","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Eliza E. Hewitt, 1887. Copyright status should be verified."},{"number":"106","title":"My God, I Have Found","lyrics":"My God, I have found the thrice blessed ground,\nWhere life, and where joy, and true comfort abound.\n\nChorus:\nHallelujah! Thine the glory! Hallelujah! Amen!\nHallelujah! Thine the glory! Amen and amen!\n\n'Tis found in the blood of Him who once stood\nMy Refuge and Safety, my Surety with God.\n\nHe bore on the tree the sentence for me,\nAnd now both the Surety and debtor are free.\n\nAccepted I am in the once-offered Lamb;\n'Twas God who Himself had devised the plan.\n\nAnd though here below, 'mid sorrow and woe,\nMy place is in heaven with Jesus I know.\n\nAnd this I shall find, for such is His mind,\nHe'll not be in glory and leave me behind.\n\nFor soon He will come and take me safe home,\nAnd make me to sit with Himself on His throne.","category":"main","id":"106","author":"Frederick W. Faber","year":"1849","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Frederick W. Faber, 1849. Copyright status should be verified."},{"number":"107","title":"On Christ, The Solid Rock, I Stand","lyrics":"My hope on nothing less is built\nThan Jesus, and the blood He spilt;\nI dare not trust the sweetest frame,\nBut wholly lean on His blest name.\n\nChorus:\nOn Christ, the solid Rock, I stand,\nAll other ground is sinking sand.\nAll other ground is sinking sand.\n\nShould darkness seem to veil His face,\nUnchanged is He, unchanged His grace;\nIn every high and stormy gale\nFaith's anchor holds within the veil.\n\nEternally His promise stands,\nMy name is graven on His hands;\nLet all around my soul give way,\nHe still abides my lasting stay.","category":"main","id":"107","author":"Edward Mote","year":"1834","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Edward Mote, 1834. Copyright status should be verified."},{"number":"108","title":"Out Of The Ivory Palaces","lyrics":"My Lord has garments so wondrous fine, and myrrh their texture fills;\nIts fragrance reached to this heart of mine, with joy my being thrills.\n\nChorus:\nOut of the ivory palaces into a world of woe,\nOnly His great eternal love made my Saviour go.\n\nHis life had also its sorrows sore, for aloes had a part;\nAnd when I think of the cross He bore, my eyes with tear-drops start.\n\nHis garments too were in cassia dipped, with healing in a touch;\nEach time my feet in some sin had slipped, He took me from its clutch.\n\nIn garments glorious He will come, to open wide the door;\nAnd I shall enter my heavenly home, to dwell for evermore.","category":"main","id":"108","author":"Henry Barraclough","year":"1915","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Henry Barraclough, 1915. Copyright status should be verified."},{"number":"109","title":"Only A Sinner","lyrics":"Naught have I gotten but what I received,\nGrace hath bestowed it since I have believed;\nBoasting excluded, pride I abase;\nI'm only a sinner saved by grace!\n\nChorus:\nOnly a sinner saved by grace!\nOnly a sinner saved by grace!\nThis is my story, to God be the glory,\nI'm only a sinner saved by grace!\n\nOnce I was foolish, and sin ruled my heart,\nCausing my footsteps from God to depart.\nJesus hath found me, happy my case;\nI now am a sinner saved by grace!\n\nTears unavailing, no merit had I;\nMercy had saved me, or else I must die;\nSin had alarmed me, fearing God's face,\nBut now I'm a sinner saved by grace!\n\nSuffer a sinner whose heart overflows,\nLoving his Saviour, to tell what he knows.\nOnce more to tell it would I embrace;\nI'm only a sinner saved by grace!","category":"main","id":"109","author":"James M. Gray","year":"1905","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by James M. Gray, 1905. Copyright status should be verified."},{"number":"110","title":"Some Time We'Ll Understand","lyrics":"Not now, but in the coming years,\nIt may be in a better land\nWe'll read the meaning of our tears,\nAnd there, some time we'll understand.\n\nChorus:\nThen trust in God through all the days;\nFear not, for He doth hold thy hand.\nThough dark thy way, still sing and praise;\nSome time, some time we'll understand.\n\nWe'll know why clouds instead of sun\nWere over many a cherished plan,\nWhy song has ceased when scarce begun;\n'Tis there, some time, we'll understand.\n\nGod knows the way, He holds the key,\nHe guides thee with unerring hand.\nSome time with tearless eyes we'll see;\nYes, there, up there we'll understand.","category":"main","id":"110","author":"Maxwell N. Cornelius","year":"1891","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Maxwell N. Cornelius, 1891. Copyright status should be verified."},{"number":"111","title":"None But Christ Can Satisfy","lyrics":"O Christ, in Thee my soul hath found, and found in Thee alone,\nThe peace, the joy, I sought so long, the bliss till now unknown\n\nChorus:\n.\nNow none but Christ can satisfy, none other name for me.\nThere's love, and life, and lasting joy, Lord Jesus, found in Thee!\n\nI sighed for rest and happiness, I yearned for them, not Thee;\nBut while I passed my Saviour by, His love laid hold on me.\n\nThe pleasures lost I sadly mourned, but never wept for Thee,\nTill grace the sightless eyes received, Thy loveliness to see.","category":"main","id":"111","author":"Anonymous/Brethren","year":"c. 1890","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Brethren, c. 1890. Copyright status should be verified."},{"number":"112","title":"O Happy Day","lyrics":"O happy day, that fixed my choice on Thee, my Saviour and my God!\nWell may this glowing heart rejoice, and tell its raptures all abroad.\n\nChorus:\nHappy day! happy day! When Jesus washed my sins away;\nHe taught me how to watch and pray, and live rejoicing every day;\nHappy day! happy day! When Jesus washed my sins away.\n\n'Tis done, the great transaction's done! I am my Lord's, and He is mine;\nHe drew me, and I followed on, glad to confess the One divine.\n\nNow rest, my long divided heart, fixed on that blessed center, rest:\nNor ever from thy Lord depart, with Him of every good possessed.","category":"main","id":"112","author":"Philip Doddridge","year":"1755","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Philip Doddridge, 1755. Copyright status should be verified."},{"number":"113","title":"Yesterday, Today, Forever","lyrics":"O how sweet the glorious message, simple faith may claim;\nYesterday, today, forever, Jesus is the same.\nStill He loves to save the sinful, heal the sick and lame;\nCheer the mourner, still the tempest, glory to His name!\n\nChorus:\nYesterday, today, forever, Jesus is the same,\nAll may change, but Jesus never, glory to His name!\nGlory to His name, glory to His name!\nAll may change, but Jesus never, glory to His name!\n\nHe who pardoned erring Peter, never need'st thou fear;\nHe that came to faithless Thomas, all thy doubt will clear.\nHe who let the loved disciple on His bosom rest,\nBids thee still, with love as tender, lean upon His breast.\n\nHe who 'mid the raging billows, walked upon the sea,\nStill can hush our wildest tempest, as on Galilee.\nHe who wept and prayed in anguish, in Gethsemane,\nDrinks with us each cup of trembling, in our agony.\n\nAs of old He walked to Emmaus, with them to abide,\nSo through all life's way He walketh, ever near our side.\nSoon again shall we behold Him -- hasten, Lord, the day!\nBut 'twill still be \"this same Jesus\" as He went away.","category":"main","id":"113","author":"Albert B. Simpson","year":"1890","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Albert B. Simpson, 1890. Copyright status should be verified."},{"number":"114","title":"O Lamb Of God, Still Keep Us","lyrics":"O Lamb of God, still keep us close to Thy pierced side;\n'Tis only there in safety and peace we can abide;\nWith foes and snares around us, and lusts and fears within;\nThe grace that sought and found us alone can keep us clean.\n\n'Tis only in Thee hiding, we feel ourselves secure;\nOnly in Thee abiding, the conflict can endure:\nThine arm the victory gaineth o'er every hateful foe;\nThy love our hearts sustaineth, in all their cares and woe.\n\nSoon shall our eyes behold Thee with rapture, face to face;\nAnd resting there in glory, we'll sing Thy power and grace:\nThy beauty, Lord, and glory, the wonders of Thy love,\nShall be the endless story of all Thy saints above.","category":"main","id":"114","author":"James G. Deck","year":"c. 1840","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by James G. Deck, c. 1840. Copyright status should be verified."},{"number":"115","title":"How Great Thou Art","lyrics":"O Lord my God, when I in awesome wonder\nConsider all the works Thy hands have made,\nI see the stars, I hear the mighty thunder,\nThy power throughout the universe displayed.\n\nChorus:\nThen sings my soul, my Saviour God to Thee:\nHow great Thou art! How great Thou art!\nThen sings my soul, my Saviour God to Thee:\nHow great Thou art! How great Thou art!\n\nWhen through the woods and forest glades I wander\nAnd hear the birds sing sweetly in the trees,\nWhen I look down from lofty mountain grandeur,\nAnd hear the brook and feel the gentle breeze.\n\nAnd when I think that God, His Son not sparing,\nSent Him to die, I scarce can take it in;\nThat on the cross, my burden fully bearing,\nHe bled and died to take away my sin.\n\nWhen Christ shall come with shout of acclamation\nAnd take me home, what joy shall fill my heart.\nThen I shall bow in humble adoration,\nAnd there proclaim, my God, how great Thou art.","category":"main","id":"115","author":"Stuart K. Hine","year":"1949","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Stuart K. Hine, 1949. Copyright status should be verified."},{"number":"116","title":"Hiding In Thee","lyrics":"O safe to the Rock that is higher than I\nMy soul in its conflicts and sorrows would fly;\nSo sinful, so weary, Thine, Thine I would be;\nThou blest Rock of Ages, I'm hiding in Thee.\n\nChorus:\nHiding in Thee, hiding in Thee,\nThou blest Rock of Ages, I'm hiding in Thee.\n\nIn the calm of the noontide, in sorrow's lone hour,\nIn times when temptation casts o'er me its power;\nIn the tempests of life, on its wide, heaving sea,\nThou blest Rock of Ages, I'm hiding in Thee.\n\nHow oft in the conflict, when pressed by the foe,\nI have fled to my Refuge and breathed out my woe;\nHow often, when trials like sea billows roll,\nHave I hidden in Thee, O Thou Rock of my soul.","category":"main","id":"116","author":"William O. Cushing","year":"1876","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by William O. Cushing, 1876. Copyright status should be verified."},{"number":"117","title":"Turn Your Eyes Upon Jesus","lyrics":"O soul, are you weary and troubled?\nNo light in the darkness you see?\nThere's light for a look at the Saviour,\nAnd life more abundant and free!\n\nChorus:\nTurn your eyes upon Jesus,\nLook full in His wonderful face;\nAnd the things of earth will grow strangely dim\nIn the light of His glory and grace.\n\nThrough death into life everlasting\nHe passed, and we follow Him there;\nOver us sin no more hath dominion\nFor more than conquerors we are!\n\nHis word shall not fail you He promised;\nBelieve Him, and all will be well;\nThen go to a world that is dying,\nHis perfect salvation to tell!","category":"main","id":"117","author":"Helen H. Lemmel","year":"1922","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Helen H. Lemmel, 1922. Copyright status should be verified."},{"number":"118","title":"O Tell Me More","lyrics":"O tell me more of Christ my Saviour;\nOn this glad theme dwell o'er and o'er,\nHis boundless grace, His saving favour,\nHis precious name, O tell me more!\n\nChorus:\nO tell me more! so much I need\nHis power to keep, His hand to lead;\nO tell me more of Him I love,\nUntil I see His face above.\n\nO tell me more of love's sweet story,\nIf you would cheer and comfort me;\nHow Jesus wept, the King of glory,\nThose tender tears of sympathy.\n\nO tell me more! how waves of sorrow\nShall hear His voice say, \"Peace, be still;\"\nHow after night, bright dawns the morrow,\nTo those who trust His blessed will.\n\nO tell me more! and I, repeating\nThe happy news, shall spread the joy;\nCome, blessed Lord, Thy work completing,\nTill songs of praise our lips employ.","category":"main","id":"118","author":"Anonymous/Brethren","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Brethren, c. 1900. Copyright status should be verified."},{"number":"119","title":"I'Ve A Home Beyond The River","lyrics":"O the blessed contemplation, when with trouble here I sigh:\nI've a home beyond the river that I'll enter by and by.\n\nChorus:\nI\u2019ve a home beyond the river, I've a mansion bright and fair;\nI've a home beyond the river -- I will dwell with Jesus there.\n\nJust a little more to labour, tell the story, watch and pray;\nJust a few more earthly sorrows, then to heaven we'll fly away.\n\nO how sweet 'twill be to meet them -- all the ransomed hosts above;\nSweeter still to see the Saviour, praise Him for redeeming love.\n\nThough the world is filled with sorrow, and the teardrops often fall,\nThere will be but joy and gladness, safe inside the jasper wall.\n\nThough the hills are rough and stony, and the valleys dark and cold,\nI must walk the path before me -- it will some day turn to gold.","category":"main","id":"119","author":"Anonymous","year":"c. 1880","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1880. Copyright status should be verified."},{"number":"120","title":"O! To Be Like Thee!","lyrics":"O! to be like Thee, blessed Redeemer,\nThis is my constant longing and prayer;\nGladly I'll forfeit all of earth's treasures,\nJesus, Thy perfect likeness to wear.\n\nChorus:\nO! to be like Thee, O! to be like Thee,\nBlessed Redeemer, pure as Thou art;\nCome in Thy sweetness, come in Thy fulness;\nStamp Thine own image deep on my heart.\n\nO! to be like Thee, full of compassion,\nLoving, forgiving, tender and kind,\nHelping the helpless, cheering the fainting,\nSeeking the wandering sinner to find.\n\nO! to be like Thee, lowly in spirit,\nHoly and harmless, patient and brave;\nMeekly enduring cruel reproaches,\nWilling to suffer, others to save.\n\nO! to be like Thee, Lord, I am coming,\nNow to receive th' anointing divine,\nAll that I am and have I am bringing,\nLord, from this moment all shall be Thine.\n\nO! to be like Thee, while I am pleading,\nPour out Thy Spirit, fill with Thy love,\nMake me a temple meet for Thy dwelling,\nFit me for life and heaven above.","category":"main","id":"120","author":"Thomas O. Chisholm","year":"1897","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Thomas O. Chisholm, 1897. Copyright status should be verified."},{"number":"121","title":"Heaven Came Down And Glory Filled My Soul","lyrics":"O what a wonderful, wonderful day,\nDay I will never forget;\nAfter I wandered in darkness away,\nJesus my Saviour I met.\nO what a tender, compassionate friend!\nHe met the needs of my heart;\nShadows dispelling, with joy I am telling,\nHe made all the darkness depart!\n\nChorus:\nHeaven came down, and glory filled my soul,\nWhen at the cross the Saviour made me whole;\nMy sins were washed away and my night was turned to day;\nHeaven came down and glory filled my soul.\n\nBorn of the Spirit with life from above\nInto God's family divine;\nJustified fully through Calvary's love,\nO what a standing is mine!\nAnd the transaction so quickly was made,\nWhen as a sinner I came,\nTook of the offer of grace He did proffer,\nHe saved me, O praise His dear name!\n\nNow I've a hope that will surely endure\nAfter the passing of time;\nI have a future in heaven for sure,\nThere in those mansions sublime.\nAnd it's because of that wonderful day\nWhen at the cross I believed;\nRiches eternal and blessings supernal\nFrom His precious hand I received.","category":"main","id":"121","author":"John W. Peterson","year":"1961","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by John W. Peterson, 1961. Copyright status should be verified."},{"number":"122","title":"Sweeter As The Years Go By","lyrics":"Of Jesus' love that sought me when I was lost in sin,\nOf wondrous grace that brought me back to His fold again;\nOf heights and depths of mercy, far deeper than the sea,\nAnd higher than the heavens, my theme shall ever be.\n\nChorus:\nSweeter as the years go by, sweeter as the years go by,\nRicher, fuller, deeper; Jesus' love is sweeter,\nSweeter as the years go by.\n\nHe trod in old Judea life's pathway long ago;\nThe people thronged about Him, His saving grace to know;\nHe healed the brokenhearted and caused the blind to see;\nAnd still His great heart yearneth in love for even me.\n\n'Twas wondrous love which led Him for us to suffer loss\nTo bear without a murmur the anguish of the cross;\nWith saints redeemed in glory, let us our voices raise,\nTill heaven and earth re-echo with our Redeemer's praise.","category":"main","id":"122","author":"Lelia N. Morris","year":"1912","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Lelia N. Morris, 1912. Copyright status should be verified."},{"number":"123","title":"It Will Be Worth It All","lyrics":"Oft-times the day seems long, our trials hard to bear;\nWe're tempted to complain, to murmur and despair.\nBut Christ will soon appear to catch His Bride away;\nAll tears forever over in God's eternal day.\n\nChorus:\nIt will be worth it all when we see Jesus;\nLife's trials will seem so small when we see Christ.\nOne glimpse of His blest face all sorrow will erase,\nSo bravely run the race till we see Him.\n\nSometimes the sky seems dark, with not a ray of light;\nWe're tossed and driven on, no human help in sight;\nBut there is One in heaven who knows our deepest care,\nLet Jesus solve your problem, just go to Him in prayer.\n\nLife's day will soon be o'er, all storms forever past;\nWe'll cross the great divide to glory, safe at last;\nWe'll share the joys of heaven, and see our Saviour's face;\nThe tempter will be banished, we'll praise God's matchless grace.","category":"main","id":"123","author":"Esther Kerr Rusthoi","year":"1941","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Esther Kerr Rusthoi, 1941. Copyright status should be verified."},{"number":"124","title":"Oh, The Peace Forever Flowing","lyrics":"Oh, the peace forever flowing from God's thoughts of His own Son,\nOh, the peace of simply knowing on the cross that all was done.\n\nPeace with God, the blood in heaven speaks of pardon now to me:\nPeace with God! the Lord is risen! Righteousness now counts me free.\n\nPeace with God through Christ in glory; God is just and God is love;\nJesus died to tell the story, foes to bring to God above.\n\nNow free access to the Father, through the Christ of God, we have;\nBy the Spirit here abiding, promise of the Father's love.\n\nJesus, Saviour, we adore Thee! Christ of God, Anointed Son;\nWe confess Thee, Lord of glory, fruits of victory Thou hast won!","category":"main","id":"124","author":"Anonymous/Brethren","year":"c. 1880","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Brethren, c. 1880. Copyright status should be verified."},{"number":"125","title":"The Old Rugged Cross","lyrics":"On a hill far away stood an old rugged cross,\nThe emblem of suffering and shame;\nAnd I love that old cross where the dearest and best\nFor a world of lost sinners was slain.\n\nChorus:\nSo I'll cherish the old rugged cross,\nTill my trophies at last I lay down;\nI will cling to the old rugged cross,\nAnd exchange it some day for a crown.\n\nOh, that old rugged cross, so despised by the world,\nHas a wondrous attraction for me;\nFor the dear Lamb of God left His glory above\nTo bear it to dark Calvary.\n\nIn the old rugged cross, stained with blood so divine,\nA wondrous beauty I see;\nFor 'twas on that old cross Jesus suffered and died\nTo pardon and sanctify me.\n\nTo the old rugged cross I would ever be true,\nIts shame and reproach gladly bear;\nThen He'll call me some day to His home far away,\nWhere His glory for ever I'll share.","category":"main","id":"125","author":"George Bennard","year":"1912","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by George Bennard, 1912. Copyright status should be verified."},{"number":"126","title":"The Unveiled Christ","lyrics":"Once our blessed Christ of beauty was veiled off from human view;\nBut through suffering death and sorrow He has rent the veil in two.\n\nChorus:\nO behold the Man of Sorrows, O behold Him in plain view,\nLo! He is the mighty conqueror, since He rent the veil in two,\nLo! He is the mighty conqueror, since He rent the veil in two.\n\nYes, He is with God the Father, interceding there for you;\nFor He is the mighty conqueror, since He rent the veil in two.\n\nHoly angels bow before Him, men of earth give praises due,\nFor He is the well beloved; He has rent the veil in two.\n\nThroughout time and endless ages, heights and depths of love so true;\nHe alone can be the giver, since He rent the veil in two.","category":"main","id":"126","author":"N.B. Herrell","year":"1916","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by N.B. Herrell, 1916. Copyright status should be verified."},{"number":"127","title":"One Day","lyrics":"One day when heaven was filled with His praises,\nWhen our condition was black as could be,\nJesus Emmanuel was born of a virgin,\nDwelling with men, my example is He!\n\nChorus:\nLiving, He loved me; dying, He saved me;\nBuried, He carried my sins far away; Rising,\nHe justified freely forever: One day\nHe's coming, O glorious day!\n\nOne day they led Him up Calvary's mountain,\nOne day they nailed Him to die on the tree;\nSuffering anguish, despised and rejected;\nBearing our sins, my Redeemer is He!\n\nOne day they left Him alone in the garden,\nOne day He rested, from suffering free;\nAngels came down o'er His tomb to keep vigil;\nHope of the hopeless, my Saviour is He!\n\nOne day the grave could conceal Him no longer,\nOne day the stone rolled away from the door;\nHe had arisen, over death He had conquered;\nNow is ascended, my Lord evermore!\n\nOne day the trumpet will sound for His coming,\nOne day the skies with His glory will shine;\nWonderful day, my beloved ones bringing;\nGlorious Saviour, this Jesus is mine!","category":"main","id":"127","author":"J. Wilbur Chapman","year":"1910","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by J. Wilbur Chapman, 1910. Copyright status should be verified."},{"number":"128","title":"How Can I Be Lonely?","lyrics":"One is walking with me over life's uneven way,\nConstantly supporting me each moment of the day;\nHow can I be lonely when such fellowship is mine\nWith my blessed Lord divine?\n\nChorus:\nHow can I be lonely, when I've Jesus only\nTo be my companion and unfailing guide?\nWhy should I be weary, or the path seem dreary,\nWhen He's walking by my side?\n\nDays may bring their burdens and their trials as I go,\nBut my Lord is near and helps to make them lighter grow.\nLife may have its crosses, or its losses, or increase;\nJesus meets them all with peace.\n\nIn life's rosy morning when the skies above are clear,\nIn its noontide hours with many cares and problems near;\nOr when evening shadows fall at closing of my day,\nJesus will be there alway.","category":"main","id":"128","author":"Anonymous","year":"c. 1920s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1920s. Copyright status should be verified."},{"number":"129","title":"Then Jesus Came","lyrics":"One sat alone beside the highway begging,\nHis eyes were blind, the light he could not see,\nHe clutched his rags and shivered in the shadows,\nThen Jesus came and bade his darkness flee.\n\nChorus:\nWhen Jesus comes the tempter's power is broken;\nWhen Jesus comes the tears are wiped away.\nHe takes the gloom and fills the life with glory,\nFor all is changed when Jesus comes to stay.\n\nUnclean! Unclean! the leper cried in torment,\nThe deaf, the dumb, in helplessness stood near;\nThe fever raged, disease had gripped its victim,\nThen Jesus came and cast out every fear.\n\nSo men today have found the Saviour able,\nThey could not conquer passion, lust and sin;\nTheir broken hearts had left them sad and lonely,\nBut Jesus' blood can make the vilest clean.","category":"main","id":"129","author":"Oswald J. Smith / Homer Rodeheaver","year":"1940","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Oswald J. Smith / Homer Rodeheaver, 1940. Copyright status should be verified."},{"number":"130","title":"Every Moment Of Every Day","lyrics":"Only to be what He wants me to be, every moment of every day;\nYielded completely to Jesus alone, every step of this pilgrim way.\n\nChorus:\nJust to be clay in the Potter's hands,\nReady to do what His word commands;\nOnly to be what He wants me to be,\nEvery moment of every day.\n\nTrusting my Saviour whatever betide, every moment of every day;\nKnowing He's able and ready to guide, every step of this pilgrim way.\n\nLiving for Jesus, surrendered and true, every moment of every day;\nWalking with only His pleasure in view, every step of this pilgrim way.","category":"main","id":"130","author":"Anonymous","year":"c. 1950s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1950s. Copyright status should be verified."},{"number":"131","title":"The Theme Of My Song","lyrics":"Others may sing of the treasures of earth,\nSing of its glitter and gold,\nBut I have a theme of far greater worth,\nExhaustless, it never grows old.\n\nChorus:\nChrist is the lovely theme of my song;\nHe is my Light from afar.\nGlory and praise e'er to Him belong;\nHe is the bright morning star.\nStrength for my weakness He doth impart,\nHe is the joy to fill every heart;\nChief of ten thousand is Jesus to me,\nHe is the theme of my song.\n\nMany an earthly story is told,\nThrilling the gay, drifting throng;\nBut telling it oft it grows threadbare and old;\nNot so with the theme of my song.\n\nFresh as the dew that falls from above,\nWelcome as dawn with its light,\nThe story of Jesus, story of love,\nBrings ever-increasing delight.\n\nThis is the theme, the theme of my song,\nEver exhaustless to me;\nAnd while time shall last, and ages prolong,\nNo theme can as wonderful be.","category":"main","id":"131","author":"Anonymous","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1900. Copyright status should be verified."},{"number":"132","title":"Make Me A Blessing","lyrics":"Out in the highways and byways of life, many are weary and sad;\nCarry the sunshine where darkness is rife, making the sorrowing glad.\n\nChorus:\nMake me a blessing, make me a blessing;\nOut of my life may Jesus shine.\nMake me a blessing, O Saviour, I pray;\nMake me a blessing to someone today.\n\nTell the sweet story of Christ and His love, tell of His power to forgive;\nOthers will trust Him if you only prove true, every moment you live.\n\nGive as 'twas given to you in your need, love as the Master loved you;\nBe to the helpless a helper indeed, unto your mission be true.","category":"main","id":"132","author":"Ira B. Wilson","year":"1924","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Ira B. Wilson, 1924. Copyright status should be verified."},{"number":"133","title":"Over Life'S Pathway","lyrics":"Over life's pathway I journey, longingly sighing for home;\nWandering a pilgrim and stranger, waiting for Jesus to come.\nHere finds no place abiding, here there's no home of rest,\nBut with my Bridegroom's returning, peace on His dear loving breast.\n\nChorus:\nPeace ... rest and home ...\n(That will be peace, rest and home, sweet home,)\nLord... quickly come, O come\n(Even so, Lord, quickly come, O come)\nNo \u2026more to roam \u2026\n(At Thy side, no more to roam alone,)\nHome, ... sweet home.\n(That will be home, sweet home.)\n\nSo while I'm here in the body, absent in form from my Lord,\nYet with my spirit in heaven, I hear His voice in the Word.\nSo at His feet I'm sitting, taught by His Spirit true;\nOut of His blest treasure bringing heavenly things old and new.\n\nIf 'tis so blest in the Spirit, walking with Jesus below,\nWhat will it be in the rapture, when of His fulness we know?\nSo with our conversation -- citizenship above;\nChanged at His glorious appearing, blameless before Him in love.","category":"main","id":"133","author":"Anonymous","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1900. Copyright status should be verified."},{"number":"134","title":"Praise The Saviour","lyrics":"Praise the Saviour, ye who know Him!\nWho can tell how much we owe Him?\nGladly let us render to Him\nAll we have and are.\n\nJesus is the name that charms us,\nHe for conflict fits and arms us,\nNothing moves and nothing harms us,\nWhile we trust in Him.\n\nTrust in Him, ye saints, forever;\nHe is faithful, changing never;\nNeither force nor guile can sever\nThose He loves from Him.\n\nKeep us, Lord, O keep us cleaving\nTo Thyself, and still believing,\nTill the hour of our receiving\nPromised joys with Thee.\n\nThen we shall be where we would be,\nThen we shall be what we should be.\nThings that are not now, nor could be,\nSoon shall be our own.","category":"main","id":"134","author":"Thomas Kelly","year":"1806","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Thomas Kelly, 1806. Copyright status should be verified."},{"number":"135","title":"I Know Whom I Have Believed","lyrics":"Praises be to God for I am glory bound,\nFor I am a miracle of grace.\nAsk of God a sign, it surely can be found\nIn a happy Christian's face.\n\nChorus:\nI know whom I have believed,\nAnd am persuaded that He is able\nTo keep that which I've committed\nUnto Him against that day, O praise the Lord!\n\nWhen the days are dreary, spent in pain or woe,\nWhen the watches of the night are long,\nI'd be trusting Jesus, so in every place\nI can always sing this song.\n\nNot alone for me, but all who will may find\nSweetest consolation for their woe.\nSeek the will of God, and for the word of Christ\nTo the blessed Bible go.","category":"main","id":"135","author":"Anonymous","year":"c. 1950s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1950s. Copyright status should be verified."},{"number":"136","title":"Redeemed","lyrics":"Redeemed! How I love to proclaim it!\nRedeemed by the blood of the Lamb!\nRedeemed through His infinite mercy,\nHis child, and forever, I am.\n\nChorus:\nRedeemed, redeemed,\nRedeemed by the blood of the Lamb.\nRedeemed, redeemed,\nHis child, and forever, I am.\n\nRedeemed and so happy in Jesus,\nNo language my rapture can tell;\nI know that the light of His presence\nWith me doth continually dwell.\n\nI think of my blessed Redeemer,\nWho cares for me all the day long;\nI sing, for I cannot be silent;\nHis love is the theme of my song.\n\nI know I shall see in His beauty,\nThe King in whose word I delight,\nWho lovingly guardeth my footsteps,\nAnd giveth me songs in the night.","category":"main","id":"136","author":"Fanny Crosby","year":"1882","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Fanny Crosby, 1882. Copyright status should be verified."},{"number":"137","title":"Rock Of Ages","lyrics":"Rock of Ages! cleft for sin, grace hath hid us safe within!\nWhere the water and the blood, from Thy riven side which flowed,\nAre of sin the double cure, cleansing from its guilt and power.\n\nNot the labour of our hands could fulfill the law's demands;\nCould our zeal no respite know, could our tears forever flow,\nNaught for sin could e'er atone, but Thy blood, and Thine alone!\n\nFound by Thee before we sought, unto Thee in mercy brought,\nWe have Thee for righteousness, from Thy fulness, grace on grace;\nThou hast washed us in Thy blood, made us live, and live to God.","category":"main","id":"137","author":"Augustus Toplady","year":"1776","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Augustus Toplady, 1776. Copyright status should be verified."},{"number":"138","title":"Cleanse Me","lyrics":"Search me, O God, and know my heart today;\nTry me, O Saviour, know my thoughts, I pray.\nSee if there be some wicked way in me;\nCleanse me from every sin, and set me free.\n\nI praise Thee, Lord, for cleansing me from sin.\nFulfill Thy word, and make me pure within;\nFill me with fire, where once I burned with shame;\nGrant my desire to magnify Thy name.\n\nLord, take my life, and make it wholly Thine;\nFill my poor heart with Thy great love divine.\nTake all my will, my passion, self and pride;\nI now surrender: Lord, in me abide.","category":"main","id":"138","author":"J. Edwin Orr","year":"1936","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by J. Edwin Orr, 1936. Copyright status should be verified."},{"number":"139","title":"Seek Ye First","lyrics":"Seek ye first the kingdom of God, and His righteousness; And all these things shall be added\nunto you, Allelu, Allelujah!\n\nMan shall not live by bread alone, but by every word, That proceeds from the mouth of God,\nAllelu, Allelujah!\n\nAsk and it shall be given unto you, seek and ye shall find, Knock and it shall be opened unto\nyou, Allelu, Allelujah!\n\nThere are three things which still remain, Allelu, Allelujah! Faith, hope and love, and the\ngreatest is love, Allelu, Allelujah!","category":"main","id":"139","author":"Karen Lafferty","year":"1972","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Karen Lafferty, 1972. Copyright status should be verified."},{"number":"140","title":"Seeking The Lost","lyrics":"Seeking the lost, yes, kindly entreating\nWanderers on the mountain astray;\n\"Come unto Me,\" His message repeating,\nWords of the Saviour speaking today.\n\nChorus:\nGoing afar upon the mountain,\nBringing the wanderer back again,\nInto the fold of my Redeemer,\nJesus the Lamb for sinners slain.\n\nSeeking the lost, and pointing to\nJesus Souls that are weak and hearts that are sore;\nTelling them of God's way of salvation,\nShowing the path to life evermore.\n\nThus I would go on missions of mercy,\nFollowing Christ from day unto day;\nCheering the faint, and raising the fallen;\nPointing the lost to Jesus, the Way.","category":"main","id":"140","author":"W.A. Ogden","year":"1880","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by W.A. Ogden, 1880. Copyright status should be verified."},{"number":"141","title":"Trusting Jesus","lyrics":"Simply trusting every day, trusting through a stormy way;\nEven when my faith is small, trusting Jesus, that is all.\n\nChorus:\nTrusting as the moments fly, trusting as the days go by;\nTrusting Him whate'er befall; trusting Jesus, that is all.\n\nBrightly doth His Spirit shine into this poor heart of mine;\nWhile He leads I cannot fall, trusting Jesus, that is all.\n\nSinging if my way be clear, praying if the path be drear;\nIf in danger, for Him call; trusting Jesus, that is all.\n\nTrusting Him while life shall last, trusting Him till earth is past;\nTill within the jasper wall, trusting Jesus, that is all.","category":"main","id":"141","author":"Edgar Page Stites","year":"1876","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Edgar Page Stites, 1876. Copyright status should be verified."},{"number":"142","title":"When We All Get To Heaven","lyrics":"Sing the wondrous love of Jesus, sing His mercy and His grace;\nIn the mansions bright and blessed, He'll prepare for us a place.\n\nChorus:\nWhen we all get to heaven, what a day of rejoicing that will be!\nWhen we all see Jesus, we'll sing and shout the victory.\n\nWhile we walk the pilgrim pathway, clouds will over-spread the sky;\nBut when travelling days are over, not a shadow, nor a sigh.\n\nLet us then be true and faithful, trusting, serving every day;\nJust one glimpse of Him in glory will the toils of life repay.\n\nOnward to the prize before us! Soon His beauty we'll behold;\nSoon the pearly gates will open, we shall tread the streets of gold.","category":"main","id":"142","author":"Eliza E. Hewitt","year":"1898","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Eliza E. Hewitt, 1898. Copyright status should be verified."},{"number":"143","title":"Some Golden Daybreak","lyrics":"Some glorious morning sorrow will cease,\nSome glorious morning all will be peace;\nHeartaches all ended, schooldays all done,\nHeaven will open, Jesus will come.\n\nChorus:\nSome golden daybreak Jesus will come;\nSome golden daybreak, battles all won,\nHe'll shout the victory, break through the blue,\nSome golden daybreak, for me, for you.\n\nSad hearts will gladden, all shall be bright,\nGood-bye for ever to earth's dark night;\nChanged in a moment, like Him to be,\nOh, glorious daybreak, Jesus we'll see.\n\nOh, what a meeting, there in the skies,\nNo tears nor crying shall dim our eyes;\nLoved ones united eternally,\nOh, what a daybreak that morn will be.","category":"main","id":"143","author":"Carl A. Blackmore","year":"1940","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Carl A. Blackmore, 1940. Copyright status should be verified."},{"number":"144","title":"Take My Life, And Let It Be","lyrics":"Take my life, and let it be consecrated, Lord, to Thee;\nTake my hands, and let them move at the impulse of Thy love,\nAt the impulse of Thy love.\n\nTake my feet, and let them be swift and beautiful for Thee;\nTake my voice, and let me sing always, only, for my King,\nAlways, only, for my King.\n\nTake my lips, and let them be filled with messages for Thee;\nTake my silver and my gold, not a mite would I withhold,\nNot a mite would I withhold.\n\nTake my love, my God, I pour at Thy feet its treasure store;\nTake my heart and let it be ever, only, all for Thee,\nEver, only, all for Thee.","category":"main","id":"144","author":"Frances R. Havergal","year":"1874","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Frances R. Havergal, 1874. Copyright status should be verified."},{"number":"145","title":"Take The Name Of Jesus","lyrics":"Take the name of Jesus with you, child of sorrow and of woe;\nIt will joy and comfort give you, take it then where'er you go.\n\nChorus:\nPrecious name, O how sweet, hope of earth and joy of heaven;\nPrecious name, O how sweet, hope of earth and joy of heaven.\n\nTake the name of Jesus ever as a shield from every snare;\nIf temptations round you gather, breathe that holy name in prayer.\n\nOh! the precious name of Jesus, how it thrills our souls with joy,\nWhen His loving arms receive us, and His songs our tongues employ!\n\nAt the name of Jesus bowing, falling prostrate at His feet,\nLord and Christ our hearts will own Him, when our journey is complete.","category":"main","id":"145","author":"Lydia Baxter","year":"1870","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Lydia Baxter, 1870. Copyright status should be verified."},{"number":"146","title":"Take The World But Give Me Jesus","lyrics":"Take the world, but give me Jesus, all its joys are but a name;\nBut His love abideth ever, through eternal years the same.\n\nChorus:\nOh, the height and depth of mercy!\nOh, the length and breadth of love!\nOh, the fulness of redemption,\nPledge of endless life above!\n\nTake the world, but give me Jesus, sweetest comfort of my soul;\nWith my Saviour watching o'er me, I can sing though billows roll.\n\nTake the world, but give me Jesus, let me view His constant smile;\nThen throughout my pilgrim journey light will cheer me all the while.\n\nTake the world, but give me Jesus, in His cross my trust shall be;\nTill, with clearer, brighter vision, face to face my Lord I see.","category":"main","id":"146","author":"Fanny Crosby","year":"1879","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Fanny Crosby, 1879. Copyright status should be verified."},{"number":"147","title":"Take Time To Be Holy","lyrics":"Take time to be holy, speak oft with thy Lord;\nAbide in Him always, and feed on His word.\nMake friends of God's children, help those who are weak,\nForgetting in nothing His blessing to seek.\n\nTake time to be holy, the world rushes on;\nSpend much time in secret with Jesus alone;\nBy looking to Jesus, like Him thou shalt be;\nThy friends in thy conduct His likeness shall see.\n\nTake time to be holy, let Him be thy Guide,\nAnd run not before Him, whatever betide;\nIn joy or in sorrow, still follow thy Lord,\nAnd, looking to Jesus, still trust in His word.\n\nTake time to be holy, be calm in thy soul;\nEach thought and each motive beneath His control;\nThus led by His Spirit to fountains of love,\nThou soon shalt be fitted for service above.","category":"main","id":"147","author":"William D. Longstaff","year":"1882","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by William D. Longstaff, 1882. Copyright status should be verified."},{"number":"148","title":"Teach Me Thy Way, O Lord","lyrics":"Teach me Thy way, O Lord, teach me Thy way!\nThy guiding grace afford; teach me Thy way!\nHelp me to walk aright, more by faith, less by sight,\nLead me with heavenly light; teach me Thy way!\n\nWhen I am sad at heart, teach me Thy way!\nWhen earthly joys depart, teach me Thy way!\nIn hours of loneliness, in times of dire distress,\nIn failure or success, teach me Thy way!\n\nWhen doubts and fears arise, teach me Thy way!\nWhen storms o'erspread the skies, teach me Thy way!\nShine through the cloud and rain, through sorrow, toil and pain,\nMake Thou my pathway plain; teach me Thy way!\n\nLong as my life shall last, teach me Thy way!\nWhere'er my lot be cast, teach me Thy way!\nUntil the race is run, until the journey's done,\nUntil the crown is won, teach me Thy way!","category":"main","id":"148","author":"B. Mansell Ramsey","year":"1919","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by B. Mansell Ramsey, 1919. Copyright status should be verified."},{"number":"149","title":"Tell Me The Old, Old Story","lyrics":"Tell me the old, old story of unseen things above,\nOf Jesus and His glory, of Jesus and His love.\nTell me the story simply, as to a little child,\nFor I am weak and weary, and helpless and defiled.\n\nChorus:\nTell me the old, old story; tell me the old, old story;\nTell me the old, old story of Jesus and His love.\n\nTell me the story slowly, that I may take it in;\nThat wonderful redemption, God's remedy for sin.\nTell me the story often, for I forget so soon;\nThe early dew of morning has passed away at noon.\n\nTell me the same old story when you have cause to fear\nThat this world's empty glory is costing me too dear.\nAnd when that world's bright glory is dawning on my soul,\nTell me the old, old story -- Christ Jesus makes thee whole.","category":"main","id":"149","author":"Katherine Hankey","year":"1866","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Katherine Hankey, 1866. Copyright status should be verified."},{"number":"150","title":"Farther Along","lyrics":"Tempted and tried, we're oft made to wonder\nWhy it should be thus all the day long,\nWhile there are others living about us,\nNever molested, though in the wrong.\n\nChorus:\nFarther along we'll know all about it,\nFarther along we'll understand why;\nCheer up, my brother, live in the sunshine,\nWe'll understand it all by and by.\n
