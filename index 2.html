<style>
  :root {
    --primary-light: #3A3A3C;
    --primary-dark: #D1D1D6;
    --background-light: #FFFFFF;
    --background-dark: #000000;
    --surface-light: #F2F2F7;
    --surface-dark: #1C1C1E;
    --foreground-light: #000000;
    --foreground-dark: #E8E8ED;
    --muted-light: #8E8E93;
    --muted-dark: #8E8E93;
    --border-light: #D1D1D6;
    --border-dark: #38383A;
    --success-light: #34C759;
    --success-dark: #30D158;
    --warning-light: #FF9500;
    --warning-dark: #FFD60A;
    --error-light: #FF3B30;
    --error-dark: #FF453A;
  }

  html[data-theme="light"] {
    color-scheme: light;
    --primary: var(--primary-light);
    --background: var(--background-light);
    --surface: var(--surface-light);
    --foreground: var(--foreground-light);
    --muted: var(--muted-light);
    --border: var(--border-light);
    --success: var(--success-light);
    --warning: var(--warning-light);
    --error: var(--error-light);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --primary: var(--primary-dark);
    --background: var(--background-dark);
    --surface: var(--surface-dark);
    --foreground: var(--foreground-dark);
    --muted: var(--muted-dark);
    --border: var(--border-dark);
    --success: var(--success-dark);
    --warning: var(--warning-dark);
    --error: var(--error-dark);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y: none;
  }

  body {
    transition: background 0.2s ease, color 0.2s ease;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--background);
    color: var(--foreground);
  }

  button {
    font-family: inherit;
    border: none;
    background: none;
    color: inherit;
    cursor: pointer;
    padding: 0;
  }

  input {
    font-family: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--primary); color: var(--background); }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 4px;
  }
  .topbar-btn {
    padding: 8px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--foreground);
  }
  .topbar-btn:active { opacity: 0.5; }
  .topbar-title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Sub header (hymn reader) ---------- */
  .subheader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    flex-shrink: 0;
    gap: 8px;
  }
  .subheader-number {
    font-size: 22px;
    font-weight: 700;
  }
  .subheader-right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .subheader-author {
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 130px;
  }
  .icon-btn {
    padding: 6px;
    display: flex;
    color: var(--muted);
    border-radius: 6px;
  }
  .icon-btn:active { opacity: 0.5; }
  .icon-btn.active { color: var(--foreground); }

  /* ---------- Lyrics area ---------- */
  .lyrics-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .lyrics-scroll {
    height: 100%;
    overflow-y: auto;
    padding: 16px 18px 40px;
    -webkit-overflow-scrolling: touch;
  }
  .verse {
    display: flex;
    margin-bottom: 20px;
    gap: 6px;
  }
  .verse-num {
    font-weight: 700;
    width: 24px;
    flex-shrink: 0;
  }
  .verse-text {
    flex: 1;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .chorus {
    margin-bottom: 20px;
    padding-left: 30px;
  }
  .chorus-text {
    font-style: italic;
    white-space: pre-wrap;
    line-height: 1.6;
    color: var(--muted);
  }
  .swipe-hint {
    display: flex;
    justify-content: space-between;
    padding: 16px 4px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .swipe-hint button {
    color: var(--muted);
    font-size: 13px;
    padding: 6px 4px;
  }
  .not-found {
    padding: 24px;
    font-size: 18px;
  }

  /* ---------- List screens (search, firstline, bookmarks) ---------- */
  .screen {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .list-row {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .list-row:active { opacity: 0.5; }
  .list-row-num {
    font-size: 17px;
    font-weight: 700;
    width: 44px;
    flex-shrink: 0;
  }
  .list-row-text {
    font-size: 16px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .section-header {
    padding: 8px 20px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    position: sticky;
    top: 0;
  }

  .toggle-row {
    display: flex;
    margin: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle-btn {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
  .toggle-btn.active {
    background: var(--foreground);
    color: var(--background);
  }

  .search-bar-wrap { padding: 8px 16px; flex-shrink: 0; }
  .search-bar {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 12px;
    gap: 8px;
  }
  .search-bar input {
    flex: 1;
    font-size: 16px;
    color: var(--foreground);
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-icon { font-size: 14px; color: var(--muted); }
  .clear-btn { color: var(--muted); font-size: 18px; padding: 2px 4px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 40px;
    text-align: center;
    color: var(--muted);
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.5; }
  .empty-title { font-size: 20px; font-weight: 600; color: var(--foreground); margin-bottom: 8px; }
  .empty-subtitle { font-size: 15px; line-height: 1.5; }

  /* ---------- Drawer ---------- */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: 80%;
    max-width: 320px;
    background: var(--background);
    z-index: 51;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 20px rgba(0,0,0,0.2);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-inner {
    flex: 1;
    overflow-y: auto;
    padding-top: max(20px, env(safe-area-inset-top));
  }
  .drawer-title {
    font-size: 18px;
    font-weight: 600;
    padding: 0 20px 16px;
  }
  .drawer-divider { height: 1px; background: var(--border); }
  .drawer-menu-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    font-size: 16px;
    width: 100%;
    text-align: left;
  }
  .drawer-menu-item:active { opacity: 0.5; }
  .drawer-menu-item svg { color: var(--muted); flex-shrink: 0; }
  .drawer-sub-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px 16px;
  }
  .drawer-sub-title { font-size: 18px; font-weight: 600; }
  .drawer-back-btn { padding: 4px; display: flex; }

  .settings-section { padding: 20px 20px 0; }
  .settings-label { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .segmented {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .segmented-item {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
  .segmented-item.active {
    background: var(--foreground);
    color: var(--background);
  }
  .coming-soon {
    background: var(--surface);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
  }

  /* ---------- Info modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .info-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
  }
  .info-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 16px; }
  .info-divider { height: 1px; background: var(--border); margin: 12px 0; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 16px; }
  .info-label { font-size: 15px; font-weight: 500; color: var(--muted); }
  .info-value { font-size: 15px; font-weight: 600; text-align: right; }
  .info-note { font-size: 13px; line-height: 1.4; text-align: center; color: var(--muted); }
  .info-dismiss {
    margin-top: 20px;
    background: var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    width: 100%;
  }

  /* ---------- Number pad modal ---------- */
  .numpad-modal {
    position: fixed;
    inset: 0;
    background: var(--background);
    z-index: 70;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .numpad-modal.open { transform: translateY(0); }
  .numpad-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(20px, env(safe-area-inset-top)) 20px 8px;
  }
  .numpad-header-title { font-size: 18px; font-weight: 600; }
  .numpad-done { font-size: 17px; color: var(--muted); padding: 4px; }
  .numpad-tabbar {
    display: flex;
    margin: 0 16px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .numpad-tab {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
  .numpad-tab.active { background: var(--foreground); color: var(--background); }
  .numpad-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .numpad-content--number { justify-content: flex-end; }

  .range-text { font-size: 16px; text-align: center; margin-top: 8px; margin-bottom: 0; color: var(--muted); }
  .display-area {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
  }
  .display-number { font-size: 44px; font-weight: 600; letter-spacing: 4px; }
  .numpad-grid { padding: 4px 16px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .numpad-row { display: flex; justify-content: space-around; margin-bottom: 10px; gap: 8px; }
  .numpad-key {
    flex: 1;
    padding: 16px 0;
    text-align: center;
    font-size: 32px;
    font-weight: 400;
    border-radius: 12px;
  }
  .numpad-key:active { opacity: 0.5; }
  .numpad-key.appendix-key {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .numpad-key.appendix-key.active { background: var(--surface); color: var(--foreground); }
  .go-button {
    display: block;
    width: 100%;
    margin-top: 8px;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    background: var(--surface);
    color: var(--muted);
  }
  .go-button.enabled { background: var(--foreground); color: var(--background); }

  .firstline-list, .search-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Hidden utility */
  .hidden { display: none !important; }

  @media (min-width: 700px) {
    #app { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  }
</style>
</head>

<script id="hymns-data" type="application/json">[{"number":"1","title":"A Little Talk With Jesus","lyrics":"A little talk with Jesus, how it smooths the rugged road,\nHow it seems to help me onward when I faint beneath my load!\nWhen my heart is crushed with sorrow and my eyes with tears are dim,\nThere is nought can yield me comfort like a little talk with Him.\n\nI tell Him I am weary, and I fain would be at rest;\nAnd I'm daily, hourly longing for a home upon His breast.\nThen He answers me so sweetly in tones of tenderest love,\nI am coming soon to take thee to My happy home above.\n\nI know the way is dreary to yonder far off clime,\nBut a little talk with Jesus will while away the time.\nAnd yet the more I know Him, and all His grace explore,\nIt only sets me longing to know Him more and more.\n\nI cannot live without Him, nor would I if I could;\nHe is my daily portion, my medicine and my food:\nHe's altogether lovely, none can with Him compare\nThe chief among ten thousand, the fairest of the fair.\n\nSo I'll wait a little longer, till His appointed time,\nAnd I'll glory in the knowledge that such a hope is mine;\nThen in my Father's dwelling where many mansions be,\nI'll sweetly talk with Jesus, and He will talk with me.","category":"main","id":"1","author":"Anonymous/Traditional","year":"c. 1850s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Traditional, c. 1850s. Copyright status should be verified."},{"number":"2","title":"Surely Goodness And Mercy","lyrics":"A pilgrim was I, and a-wandering,\nIn the cold night of sin I did roam,\nWhen Jesus, the kind Shepherd, found me,\nAnd now I am on my way home.\n\nChorus:\nSurely goodness and mercy shall follow me\nAll the days, all the days of my life;\nSurely goodness and mercy shall follow me\nAll the days, all the days of my life.\nAnd I shall dwell in the house of the Lord forever,\nAnd I shall feast at the table spread for me.\nSurely goodness and mercy shall follow me\nAll the days, all the days of my life.\n\nHe restoreth my soul when I'm weary,\nHe giveth me strength day by day;\nHe leads me beside the still waters;\nHe guards me each step of the way.\n\nWhen I walk through the dark, lonesome valley,\nMy Saviour will walk with me there;\nAnd safely His great hand will lead me\nTo the mansions He's gone to prepare.","category":"main","id":"2","author":"John W. Peterson / Alfred B. Smith","year":"1958","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by John W. Peterson / Alfred B. Smith, 1958. Copyright status should be verified."},{"number":"3","title":"He Hideth My Soul","lyrics":"A wonderful Saviour is Jesus my Lord,\nA wonderful Saviour to me,\nHe hideth my soul in the cleft of the rock,\nWhere rivers of pleasure I see.\n\nChorus:\nHe hideth my soul in the cleft of the rock\nThat shadows a dry thirsty land;\nHe hideth my life in the depths of His love,\nAnd covers me there with His hand,\nAnd covers me there with His hand.\n\nA wonderful Saviour is Jesus my Lord,\nHe taketh my burden away,\nHe holdeth me up, and I shall not be moved,\nHe giveth me strength as my day.\n\nWith numberless blessings each moment He crowns,\nAnd filled with His love so divine,\nI sing in my rapture, oh, glory to God\nFor such a Redeemer as mine!\n\nWhen clothed in His brightness, transported I rise\nTo meet Him in clouds of the sky,\nHis perfect salvation, His wonderful love,\nI'll shout with the millions on high.","category":"main","id":"3","author":"Fanny Crosby","year":"1890","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Fanny Crosby, 1890. Copyright status should be verified."},{"number":"4","title":"Abide With Me","lyrics":"Abide with me: fast falls the even tide;\nThe darkness deepens; Lord with me abide:\nWhen other helpers fail, and comforts flee,\nHelp of the helpless, O abide with me!\n\nSwift to its close ebbs out life's little day;\nEarth's joys grow dim, its glories pass away,\nChange and decay in all around I see:\nO Thou who changest not, abide with me!\n\nI need Thy presence every passing hour:\nWhat but Thy grace can foil the tempter's power?\nWho like Thyself my guide and stay can be?\nThrough cloud and sunshine, O abide with me.\n\nHold Thou Thy cross before my closing eyes;\nShine through the gloom, and point me to the skies:\nHeaven's morning breaks, and earth's vain shadows flee.\nIn life, in death, O Lord, abide with me!","category":"main","id":"4","author":"Henry F. Lyte","year":"1847","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Henry F. Lyte, 1847. Copyright status should be verified."},{"number":"5","title":"All The Way My Saviour Leads Me","lyrics":"All the way my Saviour leads me; what have I to ask beside?\nCan I doubt His tender mercy, who through life has been my guide?\nHeavenly peace, divinest comfort, here by faith in Him to dwell!\nFor I know whate'er befall me, Jesus doeth all things well;\nFor I know whate'er befall me, Jesus doeth all things well.\n\nAll the way my Saviour leads me, cheers each winding path I tread,\nGives me grace for every trial, feeds me with the living bread.\nThough my weary steps may falter, and my soul athirst may be,\nGushing from the Rock before me, Lo! a spring of joy I see;\nGushing from the Rock before me, Lo! a spring of joy I see.\n\nAll the way my Saviour leads me; O the fulness of His love!\nPerfect rest to me is promised in my Father's house above.\nWhen my spirit, clothed immortal, wings its flight to realms of day,\nThis my song through endless ages: Jesus led me all the way,\nThis my song through endless ages: Jesus led me all the way.","category":"main","id":"5","author":"Fanny Crosby","year":"1875","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Fanny Crosby, 1875. Copyright status should be verified."},{"number":"6","title":"Almost Persuaded","lyrics":"\"Almost persuaded\" now to believe;\n\"Almost persuaded\" Christ to receive;\nSeems now some soul to say,\n\"Go, Spirit, go Thy way,\nSome more convenient day on Thee I'll call.\"\n\n\"Almost persuaded,\" come, come today,\n\"Almost persuaded,\" turn not away,\nJesus invites you here,\nList to His voice so clear\nNow falling on thine ear, \"Come, wanderer, come!\"\n\n\"Almost persuaded,\" harvest is past!\"\nAlmost persuaded,\" doom comes at last!\n\"Almost\" cannot avail; \"Almost\" is but to fail!\nSad, sad, that bitter wail - \"Almost, but lost!\"","category":"main","id":"6","author":"Philip P. Bliss","year":"1871","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Philip P. Bliss, 1871. Copyright status should be verified."},{"number":"7","title":"Amazing Grace","lyrics":"Amazing grace! how sweet the sound, that saved a wretch like me!\nI once was lost but now am found; was blind, but now I see.\n\nTwas grace that taught my heart to fear, and grace my fears relieved;\nHow precious did that grace appear the hour I first believed!\n\nThrough many dangers, toils and snares, I have already come;\nTis grace hath brought me safe thus far, and grace will lead me home.\n\nWhen we've been there ten thousand years, bright shining as the sun,\nWe've no less days to sing God's praise than when we first begun.","category":"main","id":"7","author":"John Newton","year":"1779","copyrightStatus":"PUBLIC DOMAIN","copyrightNote":"Written by John Newton, 1779. In the public domain."},{"number":"8","title":"Amazing Love!","lyrics":"And can it be that I should gain\nAn interest in the Saviour's blood?\nDied He for me, who caused His pain?\nFor me, who Him to death pursued?\nAmazing love! how can it be\nThat Thou, my Lord, shouldst die for me?\n\nChorus:\nAmazing love! how can it be\nThat Thou, my Lord, shouldst die for me.\n\nHe left His Father's throne above,\nSo free, so infinite His grace,\nEmptied Himself of all but love,\nAnd bled for Adam's helpless race;\n'Tis mercy all, immense and free,\nFor, O my God, it found out me.\n\nLong my imprisoned spirit lay\nFast bound in sin and nature's night;\nThine eye diffused a quickening ray,\nI woke, the dungeon flamed with light;\nMy chains fell off, my heart was free;\nI rose, went forth and followed Thee.","category":"main","id":"8","author":"Charles Wesley","year":"1738","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charles Wesley, 1738. Copyright status should be verified."},{"number":"9","title":"And His Name Shall Be Called Wonderful","lyrics":"And His name shall be called Wonderful, and He is!\nCounsellor, He knows everything!\nThe Mighty God, He can do anything, anything;\nNothing is impossible with Him!\nThe Everlasting Father, He's the source of our supply,\nThe Prince of Peace, He calms the roughest sea!\nThen just ask and receive, just give thanks and believe,\nJesus lives, wonderful to me!","category":"main","id":"9","author":"Audrey Mieir","year":"1959","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Audrey Mieir, 1959. Copyright status should be verified."},{"number":"10","title":"And Is It So?","lyrics":"And is it so -- I shall be like Thy Son?\nIs this the grace which He for me has won?\nFather of glory, (thought beyond all thought!) --\nIn glory, to His own blest likeness brought!\n\nO Jesus, Lord, who loved me like to Thee?\nFruit of Thy work, with Thee, too, there to see\nThy glory, Lord, while endless ages roll,\nMyself the prize and travail of Thy soul.\n\nYet it must be: Thy love had not its rest\nWere Thy redeemed not with Thee fully blest.\nThat love that gives not as the world, but shares\nAll it possesses with its loved coheirs.\n\nNor I alone; Thy loved ones all, complete\nIn glory, round Thee there with joy shall meet\nAll like Thee, for Thy glory like Thee, Lord,\nObject supreme of all, by all adored.","category":"main","id":"10","author":"J.N. Darby","year":"c. 1850","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by J.N. Darby, c. 1850. Copyright status should be verified."},{"number":"11","title":"Love One Another","lyrics":"Angry words! O let them never from the tongue unbridled slip;\nMay the love of Jesus ever fill the heart and keep the lip.\n\nChorus:\nLove one another, thus saith the Saviour;\nChildren, obey the Father's blest command.\nLove one another, thus saith the Saviour;\nChildren, obey His blest command.\n\nLove is much too pure and holy, Christian bonds too sacred far, For a moment's reckless folly thus to\ndesolate and mar.","category":"main","id":"11","author":"Anonymous","year":"c. 1870s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1870s. Copyright status should be verified."},{"number":"12","title":"God Will Take Care Of You","lyrics":"Be not dismayed whate'er betide, God will take care of you;\nBeneath His wings of love abide, God will take care of you.\n\nChorus:\nGod will take care of you, through every day, o'er all the way,\nHe will take care of you, God will take care of you.\n\nThrough days of toil when heart doth fail, God will take care of you;\nWhen dangers fierce your path assail, God will take care of you,\n\nAll you may need He will provide, God will take care of you;\nNothing you ask will be denied, God will take care of you.\n\nNo matter what may be the test, God will take care of you;\nLean, weary one, upon His breast, God will take care of you.","category":"main","id":"12","author":"Civilla D. Martin","year":"1904","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Civilla D. Martin, 1904. Copyright status should be verified."},{"number":"13","title":"Beyond The Sunset","lyrics":"Beyond the sunset, O blissful morning,\nWhen with our Saviour heaven is begun.\nEarth's toiling ended, O glorious dawning;\nBeyond the sunset, when day is done.\n\nBeyond the sunset no clouds will gather,\nNo storms will threaten, no fears annoy;\nO day of gladness, O day unending,\nBeyond the sunset, eternal joy!\n\nBeyond the sunset a hand will guide me\nTo God, the Father, whom I adore;\nHis glorious presence, His words of welcome,\nWill be my portion on that fair shore.\n\nBeyond the sunset, O glad reunion,\nWith our dear loved ones who've gone before;\nIn that fair homeland we'll know no parting,\nBeyond the sunset for evermore!","category":"main","id":"13","author":"Virgil P. Brock","year":"1936","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Virgil P. Brock, 1936. Copyright status should be verified."},{"number":"14","title":"Blessed Assurance","lyrics":"Blessed assurance, Jesus is mine!\nOh, what a foretaste of glory divine!\nHeir of salvation, purchase of God;\nBorn of His Spirit, washed in His blood.\n\nChorus:\nThis is my story, this is my song,\nPraising my Saviour all the day long.\nThis is my story, this is my song,\nPraising my Saviour all the day long.\n\nPerfect salvation, all is at rest,\nI in my Saviour am happy and blest;\nWatching and waiting, looking above,\nFilled with His goodness, lost in His love.","category":"main","id":"14","author":"Fanny Crosby","year":"1873","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Fanny Crosby, 1873. Copyright status should be verified."},{"number":"15","title":"Christ Is Coming, Are You Ready?","lyrics":"Christ is coming, are you ready?\nHe is coming for His own;\nHe will call them up to meet Him,\nAnd will place them on His throne.\nHe may come, we know, at midnight,\nWhen the world in slumber lies,\nOr it may be in the morning,\nEre the day dawns in the skies.\n\nWatch ye therefore, for ye know not\nWhat the hour your Lord will come,\nWhether in the morn or midnight,\nOr in the evening gloam.\nAre your thoughts of Him when toiling\n'Mid the busy cares of day?\nAs the hours of night are passing\nDo you wake to think and pray?\n\nIs your heart aglow at even,\nAs the sun sinks in the west,\nAnd the heaven's glowing splendour\nBrings sweet thoughts of home and rest?\nBlessed rest from toil and sorrow,\nRest from suffering, pain and woe,\nAnd a home with Christ in heaven,\nHappy home to which we go!","category":"main","id":"15","author":"Anonymous","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1900. Copyright status should be verified."},{"number":"16","title":"Christ Is The Saviour Of Sinners","lyrics":"Christ is the Saviour of sinners, Christ is the Saviour for me;\nLong I was chained in sin's darkness, now by His grace I am free.\n\nChorus:\nSaviour of sinners, Saviour of sinners like me,\nShedding His blood for my ransom, this is the Saviour for me.\n\nNow I can say I am pardoned, happy and justified, free,\nSaved by my blessed Redeemer, this is the Saviour for me.\n\nJust as I was He received me, seeking from judgment to flee,\nNow there is no condemnation, this is the Saviour for me.\n\nLoved with a love that's unchanging, blessed with all blessings so free,\nHow shall I tell out His praises? This is the Saviour for me.\n\nSoon shall the glory be dawning, then when His face I shall see,\nSing, O my soul, in thy gladness, this is the Saviour for me.","category":"main","id":"16","author":"Anonymous","year":"c. 1900","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1900. Copyright status should be verified."},{"number":"17","title":"Christian Walk Carefully","lyrics":"Christian, walk carefully, danger is near;\nOn in thy journey with trembling and fear.\nSnares from without and temptations within,\nSeek to entice thee once more into sin.\nChristian, walk carefully, Christian, walk carefully,\nChristian, walk carefully, danger is near!\n\nChristian, walk cheerfully through the fierce storm,\nDark though the sky with its threat of alarm;\nSoon will the clouds and the tempest be o'er,\nThen with thy Saviour thou'lt rest evermore.\nChristian, walk cheerfully, Christian, walk cheerfully,\nChristian, walk cheerfully, through the fierce storm.\n\nChristian, walk prayerfully, oft wilt thou fall\nIf thou forget on thy Saviour to call;\nSafe thou shalt walk through each trial and care,\nIf thou art clad in the armour of prayer.\nChristian, walk prayerfully, Christian, walk prayerfully,\nChristian, walk prayerfully, fear lest thou fall.\n\nChristian, walk hopefully, sorrow and pain\nCease when the haven of rest thou shalt gain;\nThen from the lips of the Judge, thy reward:\nEnter thou into the joy of thy Lord.\nChristian, walk hopefully, Christian, walk hopefully,\nChristian, walk hopefully, rest thou shalt gain.","category":"main","id":"17","author":"Anonymous","year":"c. 1860s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1860s. Copyright status should be verified."},{"number":"18","title":"Only Trust Him","lyrics":"Come, every soul by sin oppressed, there's mercy with the Lord,\nAnd He will surely give you rest, by trusting in His word.\n\nChorus:\nOnly trust Him, only trust Him, only trust Him now;\nHe will save you, He will save you, He will save you now.\n\nFor Jesus shed His precious blood rich blessings to bestow;\nPlunge now into the crimson flood that washes white as snow.\n\nYes, Jesus is the Truth, the Way, that leads you into rest;\nBelieve in Him without delay, and you are fully blest.\n\nCome then, and join this holy band, and on to glory go,\nTo dwell in that celestial land, where joys immortal flow.","category":"main","id":"18","author":"John H. Stockton","year":"1874","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by John H. Stockton, 1874. Copyright status should be verified."},{"number":"19","title":"Complete In Thee!","lyrics":"Complete in Thee! no work of mine\nMay take, dear Lord, the place of Thine;\nThy blood hath pardon bought for me,\nAnd I am now complete in Thee.\n\nChorus:\nYea, justified! O blessed thought!\nAnd sanctified! Salvation wrought!\nThy blood hath pardon bought for me,\nAnd glorified, I too, shall be!\n\nComplete in Thee -- no more shall sin,\nThy grace hath conquered, reign within;\nThy voice shall bid the tempter flee,\nAnd I shall stand complete in Thee.\n\nComplete in Thee -- each want supplied,\nAnd no good thing to me denied;\nSince Thou my portion, Lord, wilt be,\nI ask no more, complete in Thee.","category":"main","id":"19","author":"Aaron R. Wolfe / James H. Fillmore","year":"1876","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Aaron R. Wolfe / James H. Fillmore, 1876. Copyright status should be verified."},{"number":"20","title":"Day By Day","lyrics":"Day by day, and with each passing moment,\nStrength I find to meet my trials here;\nTrusting in my Father's wise bestowment,\nI've no cause for worry or for fear.\nHe, whose heart is kind beyond all measure,\nGives unto each day what He deems best,\nLovingly its part of pain and pleasure,\nMingling toil with peace and rest.\n\nEvery day the Lord Himself is near me,\nWith a special mercy for each hour;\nAll my cares He fain would bear and cheer me,\nHe whose name is Counsellor and Power.\nThe protection of His child and treasure\nIs a charge that on Himself He laid;\nAs thy days, thy strength shall be in measure,\nThis the pledge to me He made.\n\nHelp me then, in every tribulation,\nSo to trust Thy promises, O Lord,\nThat I lose not faith's sweet consolation,\nOffered me within Thy holy word.\nHelp me Lord, when toil and trouble meeting,\nE'er to take, as from a Father's hand,\nOne by one, the days, the moments fleeting,\nTill I reach the promised land.","category":"main","id":"20","author":"Lina Sandell Berg","year":"1865","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Lina Sandell Berg, 1865. Copyright status should be verified."},{"number":"21","title":"Burdens Are Lifted At Calvary","lyrics":"Days are filled with sorrow and care, hearts are lonely and drear;\nBurdens are lifted at Calvary, Jesus is very near.\n\nChorus:\nBurdens are lifted at Calvary, Calvary, Calvary,\nBurdens are lifted at Calvary, Jesus is very near.\n\nCast your care on Jesus today, leave your worry and fear,\nBurdens are lifted at Calvary, Jesus is very near.\n\nTroubled soul, the Saviour can see every heartache and tear,\nBurdens are lifted at Calvary, Jesus is very near.","category":"main","id":"21","author":"John M. Moore","year":"1952","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by John M. Moore, 1952. Copyright status should be verified."},{"number":"22","title":"Does Jesus Care?","lyrics":"Does Jesus care when my heart is pained\nToo deeply for mirth or song;\nAs the burdens press, and the cares distress,\nAnd the way grows weary and long?\n\nChorus:\nO yes, He cares; I know He cares,\nHis heart is touched with my grief;\nWhen the days are weary, the long nights dreary,\nI know my Saviour cares.\n\nDoes Jesus care when my way is dark\nWith a nameless dread and fear?\nAs the daylight fades into deep night shades,\nDoes He care enough to be near?\n\nDoes Jesus care when I've tried and failed\nTo resist some temptation strong;\nWhen for my deep grief I find no relief,\nThough my tears flow all the night long?\n\nDoes Jesus care when I've said \"good-bye\"\nTo the dearest on earth to me,\nAnd my sad heart aches till it nearly breaks --\nIs it aught to Him? does He see?","category":"main","id":"22","author":"Frank E. Graeff","year":"1901","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Frank E. Graeff, 1901. Copyright status should be verified."},{"number":"23","title":"Moment By Moment","lyrics":"Dying with Jesus, by death reckoned mine;\nLiving with Jesus, a new life divine;\nLooking to Jesus till glory doth shine,\nMoment by moment, O Lord, I am Thine.\n\nChorus:\nMoment by moment I'm kept in His love;\nMoment by moment I've life from above;\nLooking to Jesus till glory doth shine;\nMoment by moment, O Lord, I am Thine.\n\nNever a trial that He is not there,\nNever a burden that He doth not bear,\nNever a sorrow that He doth not share,\nMoment by moment I'm under His care.\n\nNever a heartache and never a groan,\nNever a teardrop and never a moan;\nNever a danger but there on the throne,\nMoment by moment He thinks of His own.\n\nNever a weakness that He doth not feel,\nNever a sickness that He cannot heal;\nMoment by moment in woe or in weal,\nJesus my Saviour abides with me still.","category":"main","id":"23","author":"Daniel W. Whittle","year":"1893","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Daniel W. Whittle, 1893. Copyright status should be verified."},{"number":"24","title":"Did You Think To Pray?","lyrics":"Ere you left your room this morning did you think to pray?\nIn the name of Christ, our Saviour, did you ask for loving favour\nAs a shield today?\n\nChorus:\nO how praying rests the weary!\nPrayer will change the night to day;\nSo, when life seems dark and dreary,\nDon't forget to pray.\n\nWhen you met with great temptation did you think to pray?\nBy His dying love and merit did you claim the Holy Spirit\nAs your guide and stay?\n\nWhen your heart was filled with anger did you think to pray?\nDid you plead for grace, my brother, that you might forgive another\nWho had crossed your way?\n\nWhen sore trials came upon you did you think to pray?\nWhen your soul was bowed in sorrow, Balm of Gilead did you borrow\nAt the gates today?","category":"main","id":"24","author":"Mary A. Kidder","year":"1876","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Mary A. Kidder, 1876. Copyright status should be verified."},{"number":"25","title":"Face To Face","lyrics":"Face to face with Christ my Saviour,\nFace to face -- what will it be,\nWhen with rapture I behold Him,\nJesus Christ who died for me?\n\nChorus:\nFace to face I shall behold Him,\nFar beyond the starry sky;\nFace to face in all His glory,\nI shall see Him by and by!\n\nOnly faintly now I see Him,\nWith the darkening veil between,\nBut a blessed day is coming,\nWhen His glory shall be seen.\n\nWhat rejoicing in His presence,\nWhen are banished grief and pain;\nWhen the crooked ways are straightened,\nAnd the dark things shall be plain.\n\nFace to face! O blissful moment!\nFace to face to see and know,\nFace to face with my Redeemer,\nJesus Christ, who loves me so.","category":"main","id":"25","author":"Carrie E. Breck","year":"1898","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Carrie E. Breck, 1898. Copyright status should be verified."},{"number":"26","title":"That Man Of Calvary","lyrics":"Fairest of all the earth beside, chiefest of all unto Thy bride,\nFulness Divine in Thee I see, Beautiful Man of Calvary!\n\nChorus:\nThat Man of Calvary has won my heart from me,\nAnd died to set me free, blest Man of Calvary!\n\nDrinking a dire and dreadful cup, crucified Jesus lifted up,\nBearing our guilt and misery, Sorrowful Man of Calvary!\n\nGranting the sinner life and peace, granting the captive sweet release,\nShedding His blood to make us free, Merciful Man of Calvary!\n\nComfort of all my earthly way, Jesus, I'll meet Thee some sweet day,\nCenter of glory, Thee I'll see, Wonderful Man of Calvary!\n\nGathered with Thee eternally, sharing Thy love by glassy sea,\nLike Thee forever I shall be, Glorified Man of Calvary!","category":"main","id":"26","author":"Anonymous","year":"c. 1940s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1940s. Copyright status should be verified."},{"number":"27","title":"For God So Loved The World","lyrics":"For God so loved the world, He gave His only Son,\nTo die on Calvary's tree, from sin to set me free;\nSome day He's coming back, what glory that will be!\nWonderful His love to me.","category":"main","id":"27","author":"Frances Townsend","year":"1938","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Frances Townsend, 1938. Copyright status should be verified."},{"number":"28","title":"God Be With You Till We Meet Again","lyrics":"God be with you till we meet again!\nBy His counsels guide, uphold you,\nWith His sheep securely fold you;\nGod be with you till we meet again!\n\nChorus:\nTill we meet!... till we meet!...\nTill we meet at Jesus' feet;...\nTill we meet!... till we meet!...\nGod be with you till we meet again!\n\nGod be with you till we meet again!\n'Neath His wings protecting hide you,\nDaily manna still provide you;\nGod be with you till we meet again!\n\nGod be with you till we meet again!\nWhen life's perils thick confound you,\nPut His arms unfailing round you;\nGod be with you till we meet again!\n\nGod be with you till we meet again!\nKeep love's banner floating o'er you;\nSmite death's threatening wave before you;\nGod be with you till we meet again!","category":"main","id":"28","author":"Jeremiah E. Rankin","year":"1880","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Jeremiah E. Rankin, 1880. Copyright status should be verified."},{"number":"29","title":"What God Hath Promised","lyrics":"God hath not promised skies always blue,\nFlower-strewn pathways all our lives through;\nGod hath not promised sun without rain,\nJoy without sorrow, peace without pain.\n\nChorus:\nBut God hath promised strength for the day,\nRest for the labour, light for the way,\nGrace for the trials, help from above,\nUnfailing sympathy, undying love.\n\nGod hath not promised we shall not know\nToil and temptation, trouble and woe;\nHe hath not told us we shall not bear\nMany a burden, many a care.\n\nGod hath not promised smooth roads and wide,\nSwift, easy travel, needing no guide;\nNever a mountain, rocky and steep,\nNever a river, turbid and deep.","category":"main","id":"29","author":"Annie Johnson Flint","year":"1919","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Annie Johnson Flint, 1919. Copyright status should be verified."},{"number":"30","title":"Because He Lives","lyrics":"God sent His Son, they called Him Jesus,\nHe came to love, heal and forgive;\nHe lived and died to buy my pardon,\nAn empty grave is there to prove my Saviour lives.\n\nChorus:\nBecause He lives I can face tomorrow,\nBecause He lives all fear is gone;\nBecause I know He holds the future,\nAnd life is worth the living just because He lives.\n\nAnd then one day I'll cross the river,\nI'll fight life's final war with pain;\nAnd then as death gives way to victory,\nI'll see the lights of glory and I'll know He Lives.","category":"main","id":"30","author":"Bill & Gloria Gaither","year":"1971","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Bill & Gloria Gaither, 1971. Copyright status should be verified."},{"number":"31","title":"Great Is Thy Faithfulness","lyrics":"Great is Thy faithfulness, O God my Father,\nThere is no shadow of turning with Thee;\nThou changest not, Thy compassions, they fail not;\nAs Thou hast been Thou forever wilt be.\n\nChorus:\nGreat is Thy faithfulness! Great is Thy faithfulness!\nMorning by morning new mercies I see;\nAll I have needed Thy hand hath provided \u2013\nGreat is Thy faithfulness, Lord, unto me!\n\nSummer and winter, and springtime and harvest,\nSun, moon and stars in their courses above,\nJoin with all nature in manifold witness\nTo Thy great faithfulness, mercy and love.\n\nPardon for sin and a peace that endureth,\nThy own dear presence to cheer and to guide;\nStrength for today and bright hope for tomorrow,\nBlessings all mine, with ten thousand beside!","category":"main","id":"31","author":"Thomas O. Chisholm","year":"1923","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Thomas O. Chisholm, 1923. Copyright status should be verified."},{"number":"32","title":"Happiness Is The Lord","lyrics":"Happiness is to know the Saviour, living a life within His favour,\nHaving a change in my behaviour, happiness is the Lord.\n\nHappiness is to be forgiven, living a life that's worth the living.\nKnowing I'm on my way to heaven, happiness is the Lord.\n\nChorus:\nReal joy is mine, no matter if teardrops start;\nI've found the secret -- it's Jesus in my heart.\n\nHappiness is a new creation -- Jesus and me in close relation,\nHaving a part in His salvation -- happiness is the Lord.","category":"main","id":"32","author":"Ira F. Stanphill","year":"1968","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Ira F. Stanphill, 1968. Copyright status should be verified."},{"number":"33","title":"Have I An Object","lyrics":"Have I an object, Lord, below which would divide my heart with Thee;\nWhich would divert its even flow in answer to Thy constancy?\nOh teach me quickly to return, and cause my heart afresh to burn.\n\nHave I a hope, however dear, which would defer Thy coming, Lord!\nWhich would detain my spirit here where naught can lasting joy afford?\nFrom it, my Saviour, set me free, to look, and long, and wait for Thee.\n\nBe Thou the Object bright and fair to fill and satisfy the heart;\nMy hope to meet Thee in the air, and nevermore from Thee to part:\nThat I may undistracted be to follow, serve, and wait for Thee.","category":"main","id":"33","author":"J.N. Darby","year":"c. 1850","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by J.N. Darby, c. 1850. Copyright status should be verified."},{"number":"34","title":"Have Thine Own Way","lyrics":"Have Thine own way, Lord, have Thine own way;\nThou art the Potter, I am the clay;\nMold me and make me after Thy will;\nWhile I am waiting, yielded and still.\n\nHave Thine own way, Lord, have Thine own way;\nSearch me and try me, Master, today;\nWhiter than snow, Lord, wash me just now;\nAs in Thy presence humbly I bow.\n\nHave Thine own way, Lord, have Thine own way;\nWounded and weary, help me, I pray;\nPower, all power surely is Thine;\nTouch me and heal me, Saviour divine.\n\nHave Thine own way, Lord, have Thine own way,\nHold o'er my being absolute sway;\nFill with Thy Spirit till all shall see\nChrist only, always, living in me.","category":"main","id":"34","author":"Adelaide A. Pollard","year":"1902","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Adelaide A. Pollard, 1902. Copyright status should be verified."},{"number":"35","title":"Room For Jesus","lyrics":"Have you any room for Jesus, He who bore your load of sin?\nAs He knocks and asks admission, sinner, will you let Him in?\n\nChorus:\nRoom for Jesus, Lord of glory! Hasten now, His word obey!\nSwing the heart's door widely open, bid Him enter while you may!\n\nRoom for pleasure, room for business, but for Christ the Crucified,\nNot a place that He can enter, in the heart for which He died.\n\nHave you any time for Jesus, as in grace He calls again?\nOh, \"Today\" is \"time accepted,\" tomorrow you may call in vain.\n\nRoom and time now give to Jesus, soon will pass God's day of grace;\nSoon thy heart left cold and silent, and the Saviour's pleading cease.","category":"main","id":"35","author":"Asa Hull / Anonymous","year":"1878","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Asa Hull / Anonymous, 1878. Copyright status should be verified."},{"number":"36","title":"Are You Washed In The Blood","lyrics":"Have you been to Jesus for the cleansing power?\nAre you washed in the blood of the Lamb?\nAre you fully trusting in His grace this hour?\nAre you washed in the blood of the Lamb?\n\nChorus:\nAre you washed in the blood,\nIn the soul-cleansing blood of the Lamb?\nAre your garments spotless? are they white as snow?\nAre you washed in the blood of the Lamb?\n\nAre you walking daily by the Saviour's side?\nAre you washed in the blood of the Lamb?\nDo you rest each moment in the Crucified?\nAre you washed in the blood of the Lamb?\n\nWhen the Bridegroom cometh, will your robes be white?\nPure and white in the blood of the Lamb?\nWill your soul be ready for the mansions bright,\nAnd be washed in the blood of the Lamb?\n\nLay aside the garments that are stained with sin,\nAnd be washed in the blood of the Lamb!\nThere's a fountain flowing for the soul unclean;\nOh, be washed in the blood of the Lamb!","category":"main","id":"36","author":"Elisha A. Hoffman","year":"1878","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Elisha A. Hoffman, 1878. Copyright status should be verified."},{"number":"37","title":"Wasted Years","lyrics":"Have you wandered along on life's pathway,\nHave you lived without love, a life of tears;\nHave you searched for the great hidden meaning,\nOr is your life filled with long wasted years.\n\nWasted years, wasted years, O how foolish,\nAs you walk on in darkness and fears;\nTurn around, turn around, God is calling,\nHe's calling you from a life of wasted years.\n\nSearch for wisdom and seek understanding,\nThere is someone who knows and always hears;\nGive it up! Give it up! the load you're bearing,\nYou can't go on in a life of wasted years.","category":"main","id":"37","author":"Anonymous","year":"c. 1950s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1950s. Copyright status should be verified."},{"number":"38","title":"He Giveth More Grace","lyrics":"He giveth more grace when the burdens grow greater;\nHe sendeth more strength when the labours increase.\nTo added affliction He addeth His mercy;\nTo multiplied trials, His multiplied peace.\n\nChorus:\nHis love has no limit, His grace has no measure,\nHis power has no boundary known unto men;\nFor out of His infinite riches in Jesus,\nHe giveth, and giveth, and giveth again!\n\nWhen we have exhausted our store of endurance,\nWhen our strength has failed ere the day is half done,\nWhen we reach the end of our hoarded resources,\nOur Father's full giving is only begun.","category":"main","id":"38","author":"Annie Johnson Flint","year":"1941","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Annie Johnson Flint, 1941. Copyright status should be verified."},{"number":"39","title":"He Leadeth Me","lyrics":"He leadeth me, O blessed thought!\nO words with Heavenly comfort fraught!\nWhate'er I do, where'er I be,\nStill 'tis God's hand that leadeth me.\n\nChorus:\nHe leadeth me, He leadeth me!\nBy His own hand He leadeth me!\nHis faithful follower I would be,\nFor by His hand He leadeth me.\n\nAnd when my task on earth is done,\nWhen by His grace the victory's won,\nWhen Jesus comes or death I see,\nIn life or death, He leadeth me.\n\nLord I would clasp Thy hand in mine,\nNor ever murmur nor repine,\nContent whatever lot I see\nSince 'tis my God that leadeth me.","category":"main","id":"39","author":"Joseph H. Gilmore","year":"1862","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Joseph H. Gilmore, 1862. Copyright status should be verified."},{"number":"40","title":"If That Isn'T Love","lyrics":"He left the splendour of heaven, knowing His destiny\nWas the lonely hill of Golgotha, there to lay down His life for me.\n\nChorus:\nIf that isn't love the ocean is dry,\nThere's no stars in the sky, and the sparrow can't fly!\nIf that isn't love then heaven's a myth,\nThere's no feeling like this if that isn't love.\n\nEven in death He remembered the thief hanging by His side;\nHe spoke with love and compassion then He took him to Paradise.","category":"main","id":"40","author":"Dottie Rambo","year":"1969","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Dottie Rambo, 1969. Copyright status should be verified."},{"number":"41","title":"How Good Is The God We Adore","lyrics":"How good is the God we adore!\nOur faithful, unchangeable Friend;\nWhose love is as great as His power,\nAnd knows neither measure nor end!\n\n'Tis Jesus, the First and the Last,\nWhose Spirit shall guide us safe home;\nWe'll praise Him for all that is past,\nAnd trust Him for all that's to come.","category":"main","id":"41","author":"Joseph Hart","year":"1759","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Joseph Hart, 1759. Copyright status should be verified."},{"number":"42","title":"How Long Has It Been","lyrics":"How long has it been since you talked with the Lord\nAnd told Him your heart's hidden secrets?\nHow long since you prayed, how long since you stayed\nOn your knees 'til the light shone through?\nHow long has it been since your mind felt at ease,\nHow long since your heart knew no burden?\nCan you call Him your Friend? How long has it been\nSince you knew that He cared for you?\n\nHow long has it been since you knelt by your bed\nAnd prayed to the Lord up in heaven?\nHow long since you knew that He'd answer you,\nAnd would keep you the long night through?\nHow long has it been since you woke with the dawn\nAnd felt that the day's worth the living?\nCan you call Him your Friend? How long has it been\nSince you knew that He cared for you?","category":"main","id":"42","author":"Mosie Lister","year":"1956","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Mosie Lister, 1956. Copyright status should be verified."},{"number":"43","title":"No, Never Alone","lyrics":"How many times discouraged we sink beside the way;\nAbout us all is darkness, we hardly e'en can pray;\nThen from the mists and shadows, the sweetest voice e'er known\nSays, \"Child, am I not with thee, never to leave thee alone?\"\n\nChorus:\nNo, never alone! No, never alone!\nHe promised never to leave me, never to leave me alone!\nNo, never alone! No, never alone!\nHe promised never to leave me, never to leave me alone!\n\nO soul, hast thou forgotten the tender word and sweet,\nOf Him who left behind Him the print of bleeding feet?\n\"I never will forsake thee, O child so weary grown;\nRemember, I have promised never to leave thee alone.\"\n\nTake courage, way-worn pilgrim, though mists and shadows hide\nThe face of Him thou lovest, He's ever at thy side;\nReach out thy hand and trust Him, and lo, the clouds have flown;\nHe smiles on thee who promised never to leave thee alone.","category":"main","id":"43","author":"Anonymous","year":"c. 1890s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1890s. Copyright status should be verified."},{"number":"44","title":"I Am So Glad","lyrics":"I am so glad that our Father in heaven\nTells of His love in the Book He has given;\nWonderful things in the Bible I see:\nThis is the dearest, that Jesus loves me.\n\nChorus:\nI am so glad that Jesus loves me,\nJesus loves me, Jesus loves me.\nI am so glad that Jesus loves me,\nJesus loves even me.\n\nThough I forget Him, and wander away,\nStill He doth love me wherever I stray;\nBack to His dear loving arms would I flee,\nWhen I remember that Jesus loves me.\n\nJesus loves me and I know I love Him,\nLove brought Him down my poor soul to redeem;\nYes, it was love made Him die on the tree,\nOh, I am certain that Jesus loves me.","category":"main","id":"44","author":"Philip P. Bliss","year":"1870","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Philip P. Bliss, 1870. Copyright status should be verified."},{"number":"45","title":"I Am Thine, O Lord","lyrics":"I am Thine, O Lord; I have heard Thy voice,\nAnd it told Thy love to me;\nBut I long to rise in the arms of faith,\nAnd be closer drawn to Thee.\n\nChorus:\nDraw me nearer, nearer, blessed Lord,\nTo the cross where Thou hast died;\nDraw me nearer, nearer, nearer, blessed Lord,\nTo Thy precious, wounded side.\n\nConsecrate me now to Thy service, Lord,\nBy the power of grace divine;\nLet my soul look up with a steadfast hope,\nAnd my will be lost in Thine.\n\nOh, the pure delight of a single hour\nThat before Thy throne I spend,\nWhen I kneel in prayer, and with Thee, my God,\nI commune as friend with friend.\n\nThere are depths of love that I cannot know\nTill I cross the narrow sea;\nThere are heights of joy that I may not reach\nTill I rest in peace with Thee.","category":"main","id":"45","author":"Fanny Crosby","year":"1875","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Fanny Crosby, 1875. Copyright status should be verified."},{"number":"46","title":"I Am Waiting For The Dawning","lyrics":"I am waiting for the dawning of that bright and blessed day,\nWhen the darksome night of sorrow shall have vanished far away;\nWhen forever with my Saviour, far beyond this vale of tears,\nI shall swell the song of worship through the everlasting years.\n\nI am looking at the brightness, see, it shineth from afar,\nOf the clear and joyous beaming of the Bright and Morning Star.\nThrough the dark, gray mist of morning do I see its glorious light;\nThen away with every shadow of this sad and weary night.\n\nI am waiting for the coming of the Lord who died for me;\nOh, His words have thrilled my spirit, \"I will come again for thee.\"\nFaith can almost hear His footfall on the threshold of the door,\nAnd my heart, my heart is longing to be with Him evermore.","category":"main","id":"46","author":"S. Trevor Francis","year":"c. 1870","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by S. Trevor Francis, c. 1870. Copyright status should be verified."},{"number":"47","title":"Just A Closer Walk With Thee","lyrics":"I am weak but Thou art strong,\nJesus keep me from all wrong,\nI'll be satisfied as long as I walk,\nLet me walk, close to Thee.\n\nChorus:\nJust a closer walk with Thee;\n\"Grant it, Jesus,\" is my plea;\nDaily walking close to Thee,\nLet it be, dear Lord, let it be.\n\nThrough this world of toils and snares,\nIf I falter, Lord, who cares?\nWho with me my burden shares?\nNone but Thee, dear Lord, none but Thee.\n\nWhen my feeble life is o'er,\nTime for me will be no more.\nGuide me gently, safely o'er\nTo Thy kingdom shore, to Thy shore.","category":"main","id":"47","author":"Anonymous/Traditional","year":"c. 1940s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Traditional, c. 1940s. Copyright status should be verified."},{"number":"48","title":"The Saviour Of The World","lyrics":"I cannot tell why He whom angels worship\nShould set His love upon the sons of men,\nOr, why, as Shepherd, He should seek the wanderers,\nTo bring them back, they know not how or when:\nBut this I know, that He was born of Mary,\nWhen Bethlehem's manger was His only home,\nAnd that He lived at Nazareth and laboured,\nAnd so the Saviour, Saviour of the world, is come.\n\nI cannot tell how silently He suffered,\nAs with His peace He graced this place of tears,\nOr how His heart upon the cross was broken,\nThe crown of pain to three and thirty years:\nBut this I know, He heals the brokenhearted,\nAnd stays our sin, and calms our lurking fear,\nAnd lifts the burden from the heavy-laden,\nFor yet the Saviour, Saviour of the world, is here.\n\nI cannot tell how He will win the nations,\nHow He will claim His earthly heritage,\nHow satisfy the needs and aspirations\nOf East and West, of sinner and of sage:\nBut this I know, all flesh shall see His glory,\nAnd He shall reap the harvest He has sown,\nAnd some glad day His sun shall shine in splendour\nWhen He the Saviour, Saviour of the world, is known.\n\nI cannot tell how all the lands shall worship,\nWhen, at His bidding, every storm is stilled,\nOr who can say how great the jubilation\nWhen all the hearts of men with love are filled:\nBut this I know, the skies will thrill with gladness,\nAnd myriad myriad human voices sing,\nAnd earth to heaven, and heaven to earth, will answer,\nAt last the Saviour, Saviour of the world, is King!","category":"main","id":"48","author":"William Y. Fullerton","year":"1929","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by William Y. Fullerton, 1929. Copyright status should be verified."},{"number":"49","title":"In The Garden","lyrics":"I come to the garden alone,\nWhile the dew is still on the roses;\nAnd the voice I hear falling on my ear\nThe Son of God discloses.\n\nChorus:\nAnd He walks with me and He talks with me,\nAnd He tells me I am His own.\nAnd the joy we share as we tarry there,\nNone other has ever known.\n\nHe speaks and the sound of His voice\nIs so sweet the birds hush their singing,\nAnd the melody that He gave to me\nWithin my heart is ringing.","category":"main","id":"49","author":"C. Austin Miles","year":"1912","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by C. Austin Miles, 1912. Copyright status should be verified."},{"number":"50","title":"I Don'T Know About Tomorrow","lyrics":"I don't know about tomorrow, I just live from day to day.\nI don't borrow from its sunshine, for its skies may turn to gray.\nI don't worry o'er the future, for I know what Jesus said,\nAnd today I'll walk beside Him, for He knows what is ahead.\n\nChorus:\nMany things about tomorrow I don't seem to understand;\nBut I know who holds tomorrow, and I know He holds my hand.\n\nEvery step is getting brighter, as the golden stairs I climb;\nEvery burden's getting lighter, every cloud is silver-lined;\nThere the sun is always shining, there no tear will dim the eye;\nAt the ending of the rainbow, where the mountains touch the sky.\n\nI don't know about tomorrow, it may bring me poverty;\nBut the One who feeds the sparrow, is the One who stands by me.\nAnd the path that be my portion, may be through the flame or flood,\nBut His presence goes before me, and I'm covered with His blood.","category":"main","id":"50","author":"Ira F. Stanphill","year":"1950","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Ira F. Stanphill, 1950. Copyright status should be verified."},{"number":"51","title":"I Gave My Life For Thee","lyrics":"I gave My life for thee, My precious blood I shed,\nThat thou might'st ransomed be, and quickened from the dead;\nI gave, I gave My life for thee, what hast thou given for Me?\n\nMy Father's home of light, My glory-circled throne,\nI left for earthly night, for wandering sad and lone;\nI left, I left it all for thee, hast thou left aught for Me?\n\nI suffered much for thee, more than thy tongue can tell,\nOf bitterest agony, to rescue thee from hell;\nI've borne, I've borne it all for thee, what hast thou borne for Me?\n\nAnd I have brought to thee, down from My home above,\nSalvation full and free, My pardon and My love;\nI bring, I bring rich gifts to thee, what hast thou brought to Me?","category":"main","id":"51","author":"Frances R. Havergal","year":"1858","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Frances R. Havergal, 1858. Copyright status should be verified."},{"number":"52","title":"In My Heart There Rings A Melody","lyrics":"I have a song that Jesus gave me, it was sent from heaven above;\nThere never was a sweeter melody, 'tis a melody of love.\n\nChorus:\nIn my heart there rings a melody,\nThere rings a melody with heaven's harmony;\nIn my heart there rings a melody;\nThere rings a melody of love.\n\nI love the Christ who died on Calvary, for He washed my sins away;\nHe put within my heart a melody, and I know it's there to stay.\n\n'Twill be my endless theme in glory, with the ransomed I will sing;\n'Twill be a song with glorious harmony, when the courts of heaven ring.","category":"main","id":"52","author":"Elton M. Roth","year":"1924","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Elton M. Roth, 1924. Copyright status should be verified."},{"number":"53","title":"I Have Decided To Follow Jesus","lyrics":"I have decided to follow Jesus,\nI have decided to follow Jesus,\nI have decided to follow Jesus,\nNo turning back, no turning back.\n\nThough none go with me, by grace I'll follow,\nThough none go with me, by grace I'll follow,\nThough none go with me, by grace I'll follow,\nNo turning back, no turning back.\n\nThe world behind me, and Christ before me,\nThe world behind me, and Christ before me,\nThe world behind me, and Christ before me,\nNo turning back, no turning back.\n\nO take this old world but give me Jesus,\nO take this old world but give me Jesus,\nO take this old world but give me Jesus,\nI'll not go back, I'll not go back.","category":"main","id":"53","author":"Anonymous/Indian folk hymn","year":"c. 1800s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous/Indian folk hymn, c. 1800s. Copyright status should be verified."},{"number":"54","title":"I Have Found A Friend In Jesus","lyrics":"I have found a friend in Jesus, He's everything to me,\nHe's the fairest of ten thousand to my soul;\nThe Son of God from Heaven, in Him alone I see\nAll I need to cleanse and make me fully whole.\nIn sorrow He's my comfort, in trouble He's my stay;\nHe tells me every care on Him to roll.\n\nChorus:\nHe's the Son of God from heaven, the Bright and Morning Star,\nHe's the fairest of ten thousand to my soul.\n\nHe all my grief has taken, and all my sorrows borne;\nIn temptation He's my strong and mighty tower;\nHe has all my sins forgiven and Him I do adore\nFrom my heart, and now He keeps me by His power.\n\nThough all the world forsake me, and Satan tempt me sore,\nThrough Jesus I shall safely reach the goal.\nHe will never, never leave me, nor yet forsake me here,\nAnd by His grace I seek to do His will;\n\nA wall of fire about me, I've nothing now to fear,\nWith His manna He my hungry soul shall fill.\nThen sweeping up to glory to see His blessed face,\nWhere rivers of delight shall ever roll.","category":"main","id":"54","author":"Charles W. Fry","year":"1881","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charles W. Fry, 1881. Copyright status should be verified."},{"number":"55","title":"Victory In Jesus","lyrics":"I heard an old, old story, how a Saviour came from glory,\nHow He gave His life on Calvary to save a wretch like me.\nI heard about His groaning, of His precious blood's atoning,\nThen I repented of my sin and won the victory.\n\nChorus:\nO victory in Jesus, my Saviour, forever!\nHe sought me and bought me with His atoning blood.\nHe loved me ere I knew Him, and all my love is due him \u2013\nHe plunged me to victory beneath the cleansing flood.\n\nI heard about His healing, of His cleansing power revealing,\nHow He made the lame to walk again and caused the blind to see.\nAnd then I cried, \"Dear Jesus, come and heal my broken spirit,\"\nAnd somehow Jesus came and brought to me the victory.\n\nI heard about a mansion He has built for me in glory,\nAnd I heard about the streets of gold beyond the crystal sea;\nAbout the angels singing and the old redemption story,\nAnd some sweet day I'll sing up there the song of victory.","category":"main","id":"55","author":"E.M. Bartlett","year":"1939","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by E.M. Bartlett, 1939. Copyright status should be verified."},{"number":"56","title":"I Heard The Voice Of Jesus","lyrics":"I heard the voice of Jesus say, \"Come unto Me and rest;\nLay down, thou weary one, lay down thy head upon my breast.\"\nI came to Jesus as I was, weary, and worn, and sad;\nI found in Him a resting place, and He has made me glad.\n\nI heard the voice of Jesus say, \"Behold I freely give\nThe living water -- thirsty one, stoop down, and drink, and live.\"\nI came to Jesus, and I drank of that life-giving stream;\nMy thirst was quenched, my soul revived, and now I live in Him.\n\nI heard the voice of Jesus say, \"I am this dark world's light:\nLook unto Me, thy morn shall rise, and all thy day be bright.\"\nI looked to Jesus and I found in Him, my Star, my Sun;\nAnd in that light of life I'll walk till travelling days be done.","category":"main","id":"56","author":"Horatius Bonar","year":"1846","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Horatius Bonar, 1846. Copyright status should be verified."},{"number":"57","title":"I Know Not Why God'S Wondrous Grace","lyrics":"I know not why God's wondrous grace to me\nHe hath made known; Nor why, unworthy as I am,\nHe claimed me for His own.\n\nChorus:\nBut I know whom I have believed, and am persuaded that\nHe is able To keep that which I've committed unto Him against that day.\n\nI know not how this saving faith to me He did impart;\nOr how believing in His Word wrought peace within my heart.\n\nI know not how the Spirit moves, convincing men of sin;\nRevealing Jesus through the Word, creating faith in Him.\n\nI know not what of good or ill may be reserved for me,\nOf weary ways or golden days before His face I see.","category":"main","id":"57","author":"Daniel W. Whittle","year":"1883","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Daniel W. Whittle, 1883. Copyright status should be verified."},{"number":"58","title":"I Love To Tell The Story","lyrics":"I love to tell the story of unseen things above,\nOf Jesus and His glory, of Jesus and His love.\nI love to tell the story, because I know 'tis true;\nIt satisfies my longings as nothing else can do.\n\nChorus:\nI love to tell the story, 'twill be my theme in glory\nTo tell the old, old story of Jesus and His love.\n\nI love to tell the story, more wonderful it seems\nThan all the golden fancies of all our golden dreams.\nI love to tell the story, it did so much for me:\nAnd that is just the reason I tell it now to thee.\n\nI love to tell the story, 'tis pleasant to repeat\nWhat seems, each time I tell it, more wonderfully sweet.\nI love to tell the story, for some have never heard\nThe message of salvation from God's own holy Word.\n\nI love to tell the story, for those who know it best\nSeem hungering and thirsting to hear it like the rest.\nAnd when in scenes of glory I sing the new, new song,\n'Twill be the old, old story that I have loved so long.","category":"main","id":"58","author":"Katherine Hankey","year":"1866","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Katherine Hankey, 1866. Copyright status should be verified."},{"number":"59","title":"I Must Tell Jesus","lyrics":"I must tell Jesus all of my trials;\nI cannot bear these burdens alone;\nIn my distress He kindly will help me;\nHe ever loves and cares for His own.\n\nChorus:\nI must tell Jesus! I must tell Jesus!\nI cannot bear my burdens alone;\nI must tell Jesus! I must tell Jesus!\nJesus can help me, Jesus alone.\n\nI must tell Jesus all of my troubles;\nHe is a kind, compassionate Friend;\nIf I but ask Him, He will deliver,\nMake of my troubles quickly an end.\n\nTempted and tried, I need a great Saviour,\nOne who can help my burdens to bear;\nI must tell Jesus, I must tell Jesus;\nHe all my cares and sorrows will share.\n\nO how the world to evil allures me!\nO how my heart is tempted to sin!\nI must tell Jesus, and He will help me\nOver the world the victory to win.","category":"main","id":"59","author":"Elisha A. Hoffman","year":"1893","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Elisha A. Hoffman, 1893. Copyright status should be verified."},{"number":"60","title":"I Need Thee Every Hour","lyrics":"I need Thee every hour, most gracious Lord;\nNo tender voice like Thine can peace afford.\n\nChorus:\nI need Thee, O I need Thee; every hour I need Thee!\nO bless me now, my Saviour, I come to Thee!\n\nI need Thee every hour, stay Thou nearby;\nTemptations lose their power when Thou art nigh.\n\nI need Thee every hour, in joy or pain;\nCome quickly and abide, or life is vain.\n\nI need Thee every hour, most Holy One;\nO make me Thine indeed, Thou blessed Son!","category":"main","id":"60","author":"Annie S. Hawks","year":"1872","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Annie S. Hawks, 1872. Copyright status should be verified."},{"number":"61","title":"He Lives","lyrics":"I serve a risen Saviour, He's on the throne today;\nI know that He is living, whatever men may say;\nI see His hand of mercy, I hear His voice of cheer,\nAnd just the time I need Him, He's always near.\n\nChorus:\nHe lives! He lives! Christ Jesus lives today.\nHe walks with me and talks with me along life's narrow way.\nHe lives! He lives! -- salvation to impart.\nYou ask me how I know He lives? He lives within my heart!\n\nIn all the world around me I see His loving care,\nAnd though my heart grows weary I never will despair;\nI know that He is leading through all the stormy blast,\nThe day of His appearing will come at last.\n\nRejoice, rejoice, O Christian, lift up your voice and sing\nEternal hallelujahs to Jesus Christ the King;\nThe hope of all who seek Him, the help of all who find,\nNone other is so loving, so good and kind.","category":"main","id":"61","author":"Alfred H. Ackley","year":"1933","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Alfred H. Ackley, 1933. Copyright status should be verified."},{"number":"62","title":"How Marvelous! How Wonderful!","lyrics":"I stand amazed in the presence of the Saviour who died for me,\nAnd wonder how He could love me, a sinner, condemned, unclean.\n\nChorus:\nHow marvelous! How wonderful! and my song shall ever be;\nHow marvelous! How wonderful is my Saviour's love for me!\n\nFor me it was in the garden He prayed: \"Not My will, but Thine;\"\nHe had no tears for His own griefs, but sweat drops of blood for mine.\n\n'Twas there the angels beheld Him, and came from the world of light\nTo sustain Him in the sorrows of Gethsemane that night.\n\nHe took my sins and my sorrows, He made them His very own.\nHe bore the burden on Calvary, and suffered and died alone.\n\nWhen with the ransomed in glory His face I at last shall see,\n'Twill be my joy through the ages to sing of His love for me.","category":"main","id":"62","author":"Charles H. Gabriel","year":"1905","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charles H. Gabriel, 1905. Copyright status should be verified."},{"number":"63","title":"Drinking At The Springs Of Living Water","lyrics":"I thirsted in the barren land of sin and shame,\nAnd nothing satisfying there I found;\nBut to the blessed cross of Christ one day I came,\nWhere springs of living water did abound.\n\nChorus:\nDrinking at the springs of living water,\nHappy now am I, my soul they satisfy;\nDrinking at the springs of living water,\nO wonderful and bountiful supply.\n\nHow sweet the living water from the hills of God,\nIt makes me glad and happy all the way;\nNow glory, grace and blessing mark the path I've trod,\nI'm shouting Hallelujah every day.\n\nO sinner, won't you come today to Calvary?\nA fountain there is flowing deep and wide;\nThe Saviour now invites you to the water free,\nWhere thirsting spirits can be satisfied.","category":"main","id":"63","author":"Anonymous","year":"c. 1910s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1910s. Copyright status should be verified."},{"number":"64","title":"Jesus And Me","lyrics":"I travelled alone upon this lonesome way,\nMy burdens were heavy and dark was my day;\nI looked for a friend, not knowing that\nHe Had all of the time been looking for me.\n\nChorus:\nNow it is Jesus and me for each tomorrow,\nFor every heartache and every sorrow;\nI know that I can depend upon my new-found friend,\nAnd so till the end it's Jesus and me.\n\nThe road may be long to heaven's pearly gate,\nI know that it's narrow, I know that it's straight;\nBut Jesus is there through eternity,\nWe'll travel along -- just Jesus and me.\n\nForever I'll sing of His great love to me,\nForever I'll tell it on land and on sea;\nI'll stay by His side, contented I'll be,\nFor all of my life it's Jesus and me.","category":"main","id":"64","author":"Anonymous","year":"c. 1940s","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Anonymous, c. 1940s. Copyright status should be verified."},{"number":"65","title":"A New Name In Glory","lyrics":"I was once a sinner but I came,\nPardon to receive from my Lord.\nThis was freely given, and I found\nThat He always kept His word.\n\nChorus:\nThere's a new name written down in glory,\nAnd it's mine! O yes, it's mine!\nAnd the white-robed angels tell the story,\n\"A sinner has come home!\"\nFor there's a new name written down in glory,\nAnd it's mine! O yes, it's mine!\nWith my sins forgiven I am bound for heaven,\nNevermore to roam.\n\nI was humbly kneeling at the cross,\nFearing nought but God's angry frown,\nWhen the heavens opened and I saw\nThat my name was written down.\n\nIn the Book 'tis written \"Saved by Grace\" -\nO the joy that came to my soul!\nNow I am forgiven and I know\nBy the blood I am made whole.","category":"main","id":"65","author":"C. Austin Miles","year":"1910","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by C. Austin Miles, 1910. Copyright status should be verified."},{"number":"66","title":"Love Lifted Me","lyrics":"I was sinking deep in sin, far from the peaceful shore,\nVery deeply stained within, sinking to rise no more;\nBut the Master of the sea heard my despairing cry,\nFrom the waters lifted me, now safe am I.\n\nChorus:\nLove lifted me! Love lifted me!\nWhen nothing else could help, love lifted me.\nLove lifted me! Love lifted me!\nWhen nothing else could help, love lifted me.\n\nAll my heart to Him I give, ever to Him I'd cling,\nIn His blessed presence live, ever His praises sing.\nLove so mighty and so true merits my soul's best songs;\nFaithful, loving service, too, to Him belongs.\n\nSouls in danger, look above, Jesus completely saves;\nHe will lift you by His love out of the angry waves.\nHe's the Master of the sea, billows His will obey;\nHe your Saviour wants to be, be saved today.","category":"main","id":"66","author":"James Rowe","year":"1912","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by James Rowe, 1912. Copyright status should be verified."},{"number":"67","title":"Love Lifted Me","lyrics":"I will sing of my Redeemer, and His wondrous love to me;\nOn the cruel cross He suffered, from the curse to set me free.\n\nChorus:\nSing, O sing of my Redeemer! With His blood He purchased me;\nOn the cross He sealed my pardon, paid the debt, and made me free.\n\nI will tell the wondrous story, how my lost estate to save,\nIn His boundless love and mercy, He the ransom freely gave.\n\nI will praise my dear Redeemer; His triumphant power I'll tell,\nHow the victory He giveth over sin, and death, and hell.","category":"main","id":"67","author":"James Rowe","year":"1912","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by James Rowe, 1912. Copyright status should be verified."},{"number":"68","title":"No One Ever Cared For Me Like Jesus","lyrics":"I would love to tell you what I think of Jesus\nSince I found in Him a friend so strong and true;\nI would tell you how He changed my life completely,\nHe did something that no other friend could do.\n\nChorus:\nNo one ever cared for me like Jesus,\nThere's no other friend so kind as He;\nNo one else could take the sin and darkness from me,\nO how much He cared for me!\n\nAll my life was full of sin when Jesus found me,\nAll my heart was full of misery and woe;\nJesus placed His strong and loving arms about me,\nAnd He led me in the way I ought to go.\n\nEvery day He comes to me with new assurance,\nMore and more I understand His words of love;\nBut I'll never know just why He came to save me,\nTill some day I see His blessed face above.","category":"main","id":"68","author":"Charles F. Weigle","year":"1932","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Charles F. Weigle, 1932. Copyright status should be verified."},{"number":"69","title":"I'D Rather Have Jesus","lyrics":"I'd rather have Jesus than silver or gold,\nI'd rather be His than have riches untold;\nI'd rather have Jesus than houses or lands,\nI'd rather be led by His nail-pierced hand.\n\nChorus:\nThan to be the king of a vast domain\nAnd be held in sin's dread sway;\nI'd rather have Jesus than anything\nThis world affords today.\n\nI'd rather have Jesus than men's applause,\nI'd rather be faithful to His dear cause;\nI'd rather have Jesus than world-wide fame,\nI'd rather be true to His holy Name.\n\nHe's fairer than lilies of rarest bloom;\nHe's sweeter than honey from out of the comb.\nHe's all that my hungering spirit needs;\nI'd rather have Jesus and let Him lead.","category":"main","id":"69","author":"Rhea F. Miller / George Beverly Shea","year":"1922/1939","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Rhea F. Miller / George Beverly Shea, 1922/1939. Copyright status should be verified."},{"number":"70","title":"If I Gained The World","lyrics":"If I gained the world but lost the Saviour,\nWere my life worth living for a day?\nCould my yearning heart find rest and comfort\nIn the things that soon must pass away?\nIf I gained the world, but lost the Saviour,\nWould my gain be worth the toil and strife?\nAre all earthly treasures worth comparing\nWith the gift of God, eternal
