eights of love, what depths of peace,\nWhen fears are stilled, when strivings cease!\nMy Comforter, my All in All,\nHere in the love of Christ I stand.\n\nIn Christ alone! \u2013 who took on flesh,\nFullness of God in helpless babe.\nThis gift of love and righteousness,\nScorned by the ones He came to save:\nTill on that cross as Jesus died,\nThe wrath of God was satisfied \u2013\nFor every sin on Him was laid;\nHere in the death of Christ I live.\n\nThere in the ground His body lay,\nLight of the world by darkness slain:\nThen bursting forth in glorious day\nUp from the grave He rose again!\nAnd as He stands in victory\nSin's curse has lost its grip on me,\nFor I am His and He is mine \u2013\nBought with the precious blood of Christ.\n\nNo guilt in life, no fear in death,\nThis is the power of Christ in me;\nFrom life's first cry to final breath,\nJesus commands my destiny.\nNo power of hell, no scheme of man,\nCan ever pluck me from His hand:\nTill He returns or calls me home,\nHere in the power of Christ I'll stand.","category":"appendix","id":"42A","author":"Keith Getty / Stuart Townend","year":"2001","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Keith Getty / Stuart Townend, 2001. Copyright status should be verified."},{"number":"43A","title":"Be Thou My Vision","lyrics":"Be thou my vision, O Lord of my heart;\nNaught be all else to me save that thou art.\nThou my best thought by day and by night;\nWaking or sleeping, thy presence my light.\n\nBe thou my wisdom, and thou my true Word;\nI ever with thee and thou with me, Lord.\nThou my great Father, I thy dear child;\nThou in me dwelling, with thee reconciled.\n\nBe thou my breastplate, my sword for the fight;\nBe thou my dignity, thou my delight.\nThou my soul's shelter, thou my high tow'r;\nRaise thou me Heav'nward, O Pow'r of my pow'r.\n\nRiches I heed not, nor vain, empty praise;\nThou mine inheritance, now and always.\nThou and thou only, first in my heart,\nHigh King of Heaven, my treasure thou art.\n\nHigh King of Heaven, my victory won,\nMay I reach Heaven's joys, O bright Heav'ns Sun!\nHeart of my heart, whatever befall,\nStill be my vision, O Ruler of all.","category":"appendix","id":"43A","author":"Dallan Forgaill / Mary Byrne","year":"c. 8th century / 1905","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Traditional Irish, c. 8th century. Copyright status should be verified."},{"number":"44A","title":"Unto Thee, O Lord (Psalm 25)","lyrics":"Unto thee, O LORD, do I lift up my soul\nUnto thee, O LORD, do I lift up my soul\n\nChorus:\nO my God, I trust in thee:\nlet me not be ashamed,\nlet not mine enemies triumph over me.\n\nYea let none that wait on thee be ashamed\nYea let none that wait on thee be ashamed\n\nShew me thy ways, teach me thy paths\nShew me thy ways, teach me thy paths\n\nLead me in thy truth, and teach me\nLead me in thy truth, and teach me\n\nRemember not the sins of my youth\nRemember not the sins of my youth","category":"appendix","id":"44A","author":"Scripture/Traditional","year":"Ancient","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Scripture/Traditional, Ancient. Copyright status should be verified."},{"number":"45A","title":"Make a Joyful Noise (Psalm 100)","lyrics":"Make a joyful noise unto the Lord\nAll ye, all ye lands\nServe the Lord, the Lord with gladness\nCome before his presence with singing\n\nChorus:\n(Guys) Praise the Lord\n(Girls) Glory Glory, Glory hallelujah\n(Guys) Praise the Lord\n(Girls) Glory Glory, Glory hallelujah\n(Guys) Praise the Lord\n(Girls) Glory Glory, Glory hallelujah\n(Guys) Praise the Lord\n(Girls) Glory Glory, Glory hallelujah\nPraise the Lord\n\nKnow ye that the Lord is God\nIt is he that hath made us\nAnd not we ourselves\nWe are his people and the sheep of his pasture\n\nEnter into his gates with thanksgiving\nAnd into his courts with praise\nBe thankful unto him\nAnd bless, and bless his name\n\nFor the Lord, the Lord is good\nHis mercy is everlasting\nAnd his truth, his truth endureth\nTo all, to all generations","category":"appendix","id":"45A","author":"Scripture/Traditional","year":"Ancient","copyrightStatus":"UNCERTAIN","copyrightNote":"Written by Scripture/Traditional, Ancient. Copyright status should be verified."}]</script>

<script>
(function() {
  "use strict";

  /* ============================================================
     DATA
  ============================================================ */
  const HYMNS = JSON.parse(document.getElementById('hymns-data').textContent);
  const MAIN_HYMNS = HYMNS.filter(h => h.category === 'main');
  const APPENDIX_HYMNS = HYMNS.filter(h => h.category === 'appendix');

  function getHymnById(id) {
    return HYMNS.find(h => h.id === id);
  }

  function searchHymns(query) {
    const q = query.toLowerCase().trim();
    if (!q) return [];
    return HYMNS.filter(h =>
      h.number.toLowerCase().includes(q) ||
      h.title.toLowerCase().includes(q) ||
      h.lyrics.toLowerCase().includes(q)
    );
  }

  function getFirstLine(hymn) {
    const lines = hymn.lyrics.split('\n');
    for (const l of lines) {
      const trimmed = l.trim();
      if (trimmed.length > 0 && trimmed !== 'Chorus:' && !/^\d+\.?\s*$/.test(trimmed)) {
        return trimmed;
      }
    }
    return hymn.title;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ============================================================
     STORAGE / SETTINGS
  ============================================================ */
  const STORAGE_KEYS = {
    APPEARANCE: 'yp_appearance',
    FONT_SIZE: 'yp_font_size',
    BOLD_TEXT: 'yp_bold_text',
    FAVORITES: 'yp_favorites',
    HISTORY: 'yp_history',
    CURRENT_HYMN: 'yp_current_hymn',
  };

  const FONT_SIZE_VALUES = { small: 14, medium: 17, large: 20, xlarge: 24 };

  function safeGet(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) { return fallback; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  const state = {
    appearance: safeGet(STORAGE_KEYS.APPEARANCE, 'system'),
    fontSize: safeGet(STORAGE_KEYS.FONT_SIZE, 'medium'),
    boldText: safeGet(STORAGE_KEYS.BOLD_TEXT, 'false') === 'true',
    favorites: new Set(JSON.parse(safeGet(STORAGE_KEYS.FAVORITES, '[]'))),
    // History entries are { id, t } where t is a timestamp (ms). Older saved
    // history was plain id strings; migrate those to entries with no date.
    history: JSON.parse(safeGet(STORAGE_KEYS.HISTORY, '[]')).map(x => typeof x === 'string' ? { id: x, t: null } : x),
    currentHymnId: safeGet(STORAGE_KEYS.CURRENT_HYMN, '1'),
  };

  function applyTheme() {
    let scheme = state.appearance;
    if (scheme === 'system') {
      scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', scheme);
  }

  function setAppearance(mode) {
    state.appearance = mode;
    safeSet(STORAGE_KEYS.APPEARANCE, mode);
    applyTheme();
  }

  function setFontSize(size) {
    state.fontSize = size;
    safeSet(STORAGE_KEYS.FONT_SIZE, size);
    render();
  }

  function setBoldText(bold) {
    state.boldText = bold;
    safeSet(STORAGE_KEYS.BOLD_TEXT, String(bold));
    render();
  }

  function toggleFavorite(id) {
    if (state.favorites.has(id)) state.favorites.delete(id);
    else state.favorites.add(id);
    safeSet(STORAGE_KEYS.FAVORITES, JSON.stringify([...state.favorites]));
    render();
  }

  function addToHistory(id) {
    const now = Date.now();
    // Repeats are allowed, even on the same day - just not the same song
    // twice in a row on the same day.
    const last = state.history[0];
    const backToBackToday = last && last.id === id && last.t &&
      new Date(last.t).toDateString() === new Date(now).toDateString();
    if (backToBackToday) return;
    state.history = [{ id: id, t: now }, ...state.history].slice(0, 200);
    safeSet(STORAGE_KEYS.HISTORY, JSON.stringify(state.history));
  }

  function historyDayLabel(t) {
    const d = new Date(t);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    const opts = { weekday: 'long', month: 'short', day: 'numeric' };
    if (d.getFullYear() !== today.getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  function setCurrentHymnId(id) {
    state.currentHymnId = id;
    safeSet(STORAGE_KEYS.CURRENT_HYMN, id);
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (state.appearance === 'system') applyTheme();
  });

    bookmarkEmpty48: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
    home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
  };

  /* ============================================================
     UI STATE (modals/drawer)
  ============================================================ */
  const ui = {
    drawerOpen: false,
    drawerContent: 'menu', // menu | bookmarks | history | settings | firstline
    infoOpen: false,
    numpadOpen: false,
    numpadTab: 'number', // number | search | firstline
    numpadInput: '',
    numpadAppendix: false,
    drawerSearchQuery: '', // backing query for the numpad's Search tab
    drawerSortMode: 'number',
    firstlineSortMode: 'number',
  };

  /* ============================================================
     NAVIGATION
  ============================================================ */
  function goToHymn(id, addHistory = true) {
    const hymn = getHymnById(id);
    if (!hymn) return;
    setCurrentHymnId(id);
    if (addHistory) addToHistory(id);
    ui.drawerOpen = false;
    ui.numpadOpen = false;
    render();
    const scrollEl = document.querySelector('.lyrics-scroll');
    if (scrollEl) scrollEl.scrollTop = 0;
  }

  /* ============================================================
     RENDER: TOP LEVEL
  ============================================================ */
  const app = document.getElementById('app');

  // Single delegated listener: survives innerHTML re-renders, so dynamically
  // updated content (like live search results) is always clickable.
  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    handleAction(el.getAttribute('data-action'), el, e);
  });

  function render() {
    applyTheme();
    const html = `
      ${renderTopBar()}
      ${renderBody()}
      ${renderDrawer()}
      ${renderInfoModal()}
      ${renderNumpadModal()}
    `;
    app.innerHTML = html;
    attachHandlers();
  }

  function renderTopBar() {
    return `
      <div class="topbar">
        <button class="topbar-btn" data-action="open-drawer" aria-label="Menu">${ICONS.menu}</button>
        <div class="topbar-title">YP Hymnbook</div>
        <button class="topbar-btn" data-action="open-numpad-number" aria-label="Go to hymn">${ICONS.search}</button>
      </div>
    `;
  }

  function renderBody() {
    return renderReader();
  }

  /* ============================================================
     RENDER: READER (Home screen)
  ============================================================ */
  function renderLyrics(hymn) {
    const lyricsFontSize = FONT_SIZE_VALUES[state.fontSize];
    const fontWeight = state.boldText ? '700' : '400';
    const paragraphs = hymn.lyrics.split('\n\n');
    let verseNum = 1;
    let html = '';
    for (const para of paragraphs) {
      const trimmed = para.trim();
      if (!trimmed) continue;
      const isChorus = trimmed.startsWith('Chorus:');
      const displayText = isChorus ? trimmed.replace('Chorus:', '').trim() : trimmed;
      if (isChorus) {
        html += `
          <div class="chorus">
            <div class="chorus-text" style="font-size:${lyricsFontSize}px; font-weight:${fontWeight};">${escapeHtml(displayText)}</div>
          </div>
        `;
      } else {
        html += `
          <div class="verse">
            <div class="verse-num" style="font-size:${lyricsFontSize}px;">${verseNum}</div>
            <div class="verse-text" style="font-size:${lyricsFontSize}px; font-weight:${fontWeight};">${escapeHtml(displayText)}</div>
          </div>
        `;
        verseNum++;
      }
    }
    return html;
  }

  function renderReader() {
    const hymn = getHymnById(state.currentHymnId) || getHymnById('1');
    if (!hymn) {
      return `<div class="not-found">Hymn not found.</div>`;
    }
    const fav = state.favorites.has(hymn.id);
    const idx = HYMNS.findIndex(h => h.id === hymn.id);
    const allSorted = [...MAIN_HYMNS, ...APPENDIX_HYMNS];
    const sortedIdx = allSorted.findIndex(h => h.id === hymn.id);
    const prevHymn = sortedIdx > 0 ? allSorted[sortedIdx - 1] : null;
    const nextHymn = sortedIdx < allSorted.length - 1 ? allSorted[sortedIdx + 1] : null;

    const author = (hymn.author && hymn.author !== 'Unknown' && hymn.author !== 'NEEDS RESEARCH') ? hymn.author : '';

    return `
      <div class="subheader">
        <button data-action="open-numpad-number" style="font: inherit;">
          <span class="subheader-number">${escapeHtml(hymn.number)}</span>
        </button>
        <div class="subheader-right">
          <span class="subheader-author">${escapeHtml(author)}</span>
          <button class="icon-btn ${fav ? 'active' : ''}" data-action="toggle-fav" data-id="${hymn.id}" aria-label="Bookmark">
            ${fav ? ICONS.bookmarkFilled : ICONS.bookmarkOutline}
          </button>
          <button class="icon-btn" data-action="open-info" aria-label="Info">${ICONS.info}</button>
        </div>
      </div>
      <div class="lyrics-wrap">
        <div class="lyrics-scroll">
          ${renderLyrics(hymn)}
          <div class="swipe-hint">
            ${prevHymn ? `<button data-action="go-hymn-adjacent" data-id="${prevHymn.id}">← ${escapeHtml(prevHymn.number)}</button>` : '<span></span>'}
            ${nextHymn ? `<button data-action="go-hymn-adjacent" data-id="${nextHymn.id}">${escapeHtml(nextHymn.number)} →</button>` : '<span></span>'}
          </div>
        </div>
      </div>
    `;
  }

  /* ============================================================
     SEARCH ROW (used by number-pad popup search)
  ============================================================ */
  function numpadSearchListHtml(q) {
    if (!q.trim()) {
      return `<div class="empty-state"><div class="empty-subtitle">Type to search hymns by title or lyrics</div></div>`;
    }
    const results = searchHymns(q);
    return results.length
      ? results.map(h => searchRowHtml(h, q)).join('')
      : `<div class="empty-state"><div class="empty-subtitle">No results found</div></div>`;
  }

  function searchRowHtml(hymn, query) {
    const q = query.toLowerCase().trim();
    let snippet = hymn.title;
    if (q) {
      const lyricsLower = hymn.lyrics.toLowerCase();
      const idx = lyricsLower.indexOf(q);
      if (idx >= 0) {
        const start = Math.max(0, idx - 10);
        const end = Math.min(hymn.lyrics.length, idx + q.length + 40);
        snippet = (start > 0 ? '…' : '') + hymn.lyrics.slice(start, end).replace(/\n/g, ' ') + (end < hymn.lyrics.length ? '…' : '');
      }
    }
    return `
      <div class="list-row" data-action="numpad-select" data-id="${hymn.id}">
        <span class="list-row-num">${escapeHtml(hymn.number)}</span>
        <span class="list-row-text">${escapeHtml(snippet)}</span>
      </div>
    `;
  }

  /* ============================================================
     RENDER: FIRST LINE TAB
  ============================================================ */
  function buildFirstLineItems(sortMode) {
    if (sortMode === 'number') {
      const items = [];
      items.push({ type: 'header', title: 'Hymns' });
      MAIN_HYMNS.forEach(h => items.push({ type: 'hymn', hymn: h, firstLine: getFirstLine(h) }));
      items.push({ type: 'header', title: 'Appendix' });
      APPENDIX_HYMNS.forEach(h => items.push({ type: 'hymn', hymn: h, firstLine: getFirstLine(h) }));
      return items;
    } else {
      const withFirstLine = HYMNS.map(h => ({ hymn: h, firstLine: getFirstLine(h) }));
      withFirstLine.sort((a, b) => a.firstLine.toLowerCase().localeCompare(b.firstLine.toLowerCase()));
      return withFirstLine.map(item => ({ type: 'hymn', hymn: item.hymn, firstLine: item.firstLine }));
    }
  }

  /* ============================================================
     RENDER: DRAWER
  ============================================================ */
  function renderDrawer() {
    let inner = '';
    if (ui.drawerContent === 'menu') {
      inner = `
        <div class="drawer-inner">
          <div class="drawer-title">YP Hymnbook</div>

          <button class="drawer-menu-item" data-action="drawer-nav" data-target="settings">${ICONS.gear}<span>Settings</span></button>
        </div>

    } else if (ui.drawerContent === 'firstline') {
      const items = buildFirstLineItems(ui.drawerSortMode);
      inner = `
        <div class="drawer-inner">
          <div class="drawer-sub-header">
            <button class="drawer-back-btn" data-action="drawer-nav" data-target="menu">${ICONS.chevronLeft}</button>
            <div class="drawer-sub-title">First Line</div>
          </div>
          <div class="toggle-row">
            <button class="toggle-btn ${ui.drawerSortMode === 'number' ? 'active' : ''}" data-action="set-drawer-sort" data-mode="number">By number</button>
            <button class="toggle-btn ${ui.drawerSortMode === 'alphabetic' ? 'active' : ''}" data-action="set-drawer-sort" data-mode="alphabetic">Alphabetic</button>
          </div>
          ${items.map(item => item.type === 'header'
            ? `<div class="section-header">${escapeHtml(item.title)}</div>`
            : `<div class="list-row" data-action="go-hymn" data-id="${item.hymn.id}">
                <span class="list-row-num" style="width:40px;font-size:15px;">${escapeHtml(item.hymn.number)}</span>
                <span class="list-row-text" style="font-size:15px;">${escapeHtml(item.firstLine)}</span>
              </div>`
          ).join('')}
        </div>
      `;
    } else if (ui.drawerContent === 'bookmarks') {
      const bookmarked = HYMNS.filter(h => state.favorites.has(h.id));
      inner = `
        <div class="drawer-inner">
          <div class="drawer-sub-header">
            <button class="drawer-back-btn" data-action="drawer-nav" data-target="menu">${ICONS.chevronLeft}</button>
            <div class="drawer-sub-title">Bookmarks</div>
          </div>
          ${bookmarked.length === 0
            ? `<div class="empty-state"><div class="empty-subtitle">No bookmarks yet.</div></div>`
            : bookmarked.map(h => `
              <div class="list-row" data-action="go-hymn" data-id="${h.id}">
                <span class="list-row-num" style="width:40px;font-size:15px;">${escapeHtml(h.number)}</span>
                <span class="list-row-text" style="font-size:15px;">${escapeHtml(h.title)}</span>
              </div>
            `).join('')}
        </div>
      `;
    } else if (ui.drawerContent === 'history') {
      const entries = state.history
        .map(en => ({ ...en, hymn: getHymnById(en.id) }))
        .filter(en => en.hymn);
      // Group by day. Entries are stored newest-first, so groups come out
      // newest day first; legacy undated entries land at the bottom.
      const groups = [];
      const groupIndex = {};
      for (const en of entries) {
        const label = en.t ? historyDayLabel(en.t) : 'Earlier';
        if (!(label in groupIndex)) {
          groupIndex[label] = groups.length;
          groups.push({ label: label, items: [] });
        }
        groups[groupIndex[label]].items.push(en);
      }
      // Entries are stored newest-first, so within each day the most
      // recent lookup is already at the top - no reordering needed.
      inner = `
        <div class="drawer-inner">
          <div class="drawer-sub-header">
            <button class="drawer-back-btn" data-action="drawer-nav" data-target="menu">${ICONS.chevronLeft}</button>
            <div class="drawer-sub-title">History</div>
          </div>
          ${entries.length === 0
            ? `<div class="empty-state"><div class="empty-subtitle">No history yet.</div></div>`
            : groups.map(g => `
              <div class="section-header">${escapeHtml(g.label)}</div>
              ${g.items.map(en => `
                <div class="list-row" data-action="go-hymn" data-id="${en.hymn.id}">
                  <span class="list-row-num" style="width:40px;font-size:15px;">${escapeHtml(en.hymn.number)}</span>
                  <span class="list-row-text" style="font-size:15px;">${escapeHtml(en.hymn.title)}</span>
                </div>
              `).join('')}
            `).join('')}
        </div>
      `;
    } else if (ui.drawerContent === 'settings') {
      inner = `
        <div class="drawer-inner">
          <div class="drawer-sub-header">
            <button class="drawer-back-btn" data-action="drawer-nav" data-target="menu">${ICONS.chevronLeft}</button>
            <div class="drawer-sub-title">Settings</div>
          </div>
          <div class="settings-section">
            <div class="settings-label">Font Size</div>
            <div class="segmented">
              ${[['small','S'],['medium','M'],['large','L'],['xlarge','XL']].map(([key,label]) => `
                <button class="segmented-item ${state.fontSize === key ? 'active' : ''}" data-action="set-font-size" data-size="${key}">${label}</button>
              `).join('')}
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-label">Bold Text</div>
            <div class="segmented">
              <button class="segmented-item ${!state.boldText ? 'active' : ''}" data-action="set-bold" data-bold="false">Off</button>
              <button class="segmented-item ${state.boldText ? 'active' : ''}" data-action="set-bold" data-bold="true">On</button>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-label">Appearance</div>
            <div class="segmented">
              ${[['system','Auto'],['light','Light'],['dark','Dark']].map(([key,label]) => `
                <button class="segmented-item ${state.appearance === key ? 'active' : ''}" data-action="set-appearance" data-mode="${key}">${label}</button>
              `).join('')}
            </div>
          </div>
          <div class="settings-section" style="padding-bottom:20px;">
            <div class="settings-label">Sheet Music</div>
            <div class="coming-soon">Coming Soon</div>
          </div>
        </div>
      `;
    }

    return `
      <div class="drawer-overlay ${ui.drawerOpen ? 'open' : ''}" data-action="close-drawer"></div>
      <div class="drawer ${ui.drawerOpen ? 'open' : ''}">${inner}</div>
    `;
  }

  /* ============================================================
     RENDER: INFO MODAL
  ============================================================ */
  function renderInfoModal() {
    const hymn = getHymnById(state.currentHymnId);
    if (!hymn) return '';
    const statusColor = hymn.copyrightStatus === 'PUBLIC DOMAIN' ? 'var(--success)'
      : hymn.copyrightStatus === 'COPYRIGHTED' ? 'var(--error)'
      : hymn.copyrightStatus === 'UNCERTAIN' ? 'var(--warning)' : 'var(--foreground)';
    return `
      <div class="modal-overlay ${ui.infoOpen ? 'open' : ''}" data-action="close-info">
        <div class="info-card" data-action="noop">
          <div class="info-title">${escapeHtml(hymn.title)}</div>
          <div class="info-divider"></div>
          <div class="info-row"><span class="info-label">Number</span><span class="info-value">${escapeHtml(hymn.number)}</span></div>
          <div class="info-row"><span class="info-label">Author</span><span class="info-value">${escapeHtml(hymn.author)}</span></div>
          <div class="info-row"><span class="info-label">Year</span><span class="info-value">${escapeHtml(hymn.year)}</span></div>
          <div class="info-row"><span class="info-label">Copyright</span><span class="info-value" style="color:${statusColor};">${escapeHtml(hymn.copyrightStatus)}</span></div>
          ${hymn.copyrightNote ? `<div class="info-divider"></div><div class="info-note">${escapeHtml(hymn.copyrightNote)}</div>` : ''}
          <button class="info-dismiss" data-action="close-info">Done</button>
        </div>
      </div>
    `;
  }

  /* ============================================================
     RENDER: NUMBER PAD MODAL
  ============================================================ */
  function numpadMatchingHymn() {
    if (!ui.numpadInput) return null;
    const searchId = ui.numpadAppendix ? ui.numpadInput + 'A' : ui.numpadInput;
    return HYMNS.find(h => h.number === searchId) || null;
  }

  function renderNumpadModal() {
    const tabs = [
      { id: 'number', label: 'Number' },
      { id: 'search', label: 'Search' },
      { id: 'firstline', label: 'First Line' },
    ];

    let content = '';
    if (ui.numpadTab === 'number') {
      const mainMax = Math.max(...MAIN_HYMNS.map(h => parseInt(h.number) || 0));
      const appMax = Math.max(...APPENDIX_HYMNS.map(h => parseInt(h.number) || 0));
      const rangeText = ui.numpadAppendix ? `1A - ${appMax}A` : `1 - ${mainMax}`;
      const displayNumber = ui.numpadInput ? (ui.numpadAppendix ? ui.numpadInput + 'A' : ui.numpadInput) : '';
      const matching = numpadMatchingHymn();
      const keys = [['1','2','3'],['4','5','6'],['7','8','9'],['APPENDIX','0','⌫']];
      content = `
        <div class="numpad-content numpad-content--number">
          <div class="range-text">${rangeText}</div>
          <div class="display-area"><div class="display-number">${escapeHtml(displayNumber)}</div></div>
          <div class="numpad-grid">
            ${keys.map(row => `
              <div class="numpad-row">
                ${row.map(key => {
                  if (key === 'APPENDIX') {
                    return `<button class="numpad-key appendix-key ${ui.numpadAppendix ? 'active' : ''}" data-action="numpad-key" data-key="${key}">APPENDIX</button>`;
                  }
                  return `<button class="numpad-key" data-action="numpad-key" data-key="${key}">${key}</button>`;
                }).join('')}
              </div>
            `).join('')}
            <button class="go-button ${matching ? 'enabled' : ''}" data-action="numpad-go" ${matching ? '' : 'disabled'}>GO</button>
          </div>
        </div>
      `;
    } else if (ui.numpadTab === 'search') {
      const q = ui.drawerSearchQuery;
      content = `
        <div class="numpad-content">
          <div class="search-bar-wrap">
            <div class="search-bar">
              <span class="search-icon">${ICONS.search}</span>
              <input type="text" id="numpad-search-input" placeholder="Search for a word or phrase" value="${escapeHtml(q)}" autocomplete="off" autocorrect="off" autocapitalize="off" />
              <button id="numpad-search-clear" class="clear-btn ${q ? '' : 'hidden'}" data-action="clear-numpad-search">✕</button>
            </div>
          </div>
          <div class="search-list" id="numpad-search-results">${numpadSearchListHtml(q)}</div>
        </div>
      `;
    } else if (ui.numpadTab === 'firstline') {
      const items = buildFirstLineItems(ui.firstlineSortMode);
      content = `
        <div class="numpad-content">
          <div class="toggle-row">
            <button class="toggle-btn ${ui.firstlineSortMode === 'number' ? 'active' : ''}" data-action="set-numpad-firstline-sort" data-mode="number">By number</button>
            <button class="toggle-btn ${ui.firstlineSortMode === 'alphabetic' ? 'active' : ''}" data-action="set-numpad-firstline-sort" data-mode="alphabetic">Alphabetic</button>
          </div>
          <div class="firstline-list">
            ${items.map(item => item.type === 'header'
              ? `<div class="section-header">${escapeHtml(item.title)}</div>`
              : `<div class="list-row" data-action="numpad-select" data-id="${item.hymn.id}">
                  <span class="list-row-num">${escapeHtml(item.hymn.number)}</span>
                  <span class="list-row-text">${escapeHtml(item.firstLine)}</span>
                </div>`
            ).join('')}
          </div>
        </div>
      `;
    }

    return `
      <div class="numpad-modal ${ui.numpadOpen ? 'open' : ''}">
        <div class="numpad-header">
          <div class="numpad-header-title">${tabs.find(t => t.id === ui.numpadTab)?.label || ''}</div>
          <button class="numpad-done" data-action="close-numpad">Done</button>
        </div>
        <div class="numpad-tabbar">
          ${tabs.map(t => `
            <button class="numpad-tab ${ui.numpadTab === t.id ? 'active' : ''}" data-action="set-numpad-tab" data-tab="${t.id}">${t.label}</button>
          `).join('')}
        </div>
        ${content}
      </div>
    `;
  }

  /* ============================================================
     EVENT HANDLING
  ============================================================ */
  function attachHandlers() {
    const numpadSearchInput = document.getElementById('numpad-search-input');
    if (numpadSearchInput) {
      numpadSearchInput.addEventListener('input', (e) => {
        ui.drawerSearchQuery = e.target.value;
        updateNumpadSearchResults();
      });
    }

    attachSwipeHandlers();
  }

  function updateNumpadSearchResults() {
    const list = document.getElementById('numpad-search-results');
    if (list) list.innerHTML = numpadSearchListHtml(ui.drawerSearchQuery);
    const clearBtn = document.getElementById('numpad-search-clear');
    if (clearBtn) clearBtn.classList.toggle('hidden', !ui.drawerSearchQuery);
  }

  function handleAction(action, el, e) {
    switch (action) {
      case 'open-drawer':
        ui.drawerOpen = true;
        ui.drawerContent = 'menu';
        render();
        break;
      case 'close-drawer':
        ui.drawerOpen = false;
        render();
        break;
      case 'drawer-nav':
        ui.drawerContent = el.getAttribute('data-target');
        render();
        break;
      case 'go-hymn':
        goToHymn(el.getAttribute('data-id'));
        break;
      case 'go-hymn-adjacent':
        goToHymn(el.getAttribute('data-id'), false);
        break;
      case 'toggle-fav':
        e.stopPropagation();
        toggleFavorite(el.getAttribute('data-id'));
        break;
      case 'open-info':
        ui.infoOpen = true;
        render();
        break;
      case 'close-info':
        ui.infoOpen = false;
        render();
        break;
      case 'open-numpad-number':
        ui.numpadOpen = true;
        ui.numpadTab = 'number';
        ui.numpadInput = '';
        ui.numpadAppendix = false;
        render();
        break;
      case 'close-numpad':
        ui.numpadOpen = false;
        render();
        break;
      case 'set-numpad-tab':
        ui.numpadTab = el.getAttribute('data-tab');
        if (ui.numpadTab === 'search') ui.drawerSearchQuery = '';
        render();
        setTimeout(() => {
          const inp = document.getElementById('numpad-search-input');
          if (inp) inp.focus();
        }, 50);
        break;
      case 'numpad-key': {
        const key = el.getAttribute('data-key');
        if (key === '⌫') {
          ui.numpadInput = ui.numpadInput.slice(0, -1);
        } else if (key === 'APPENDIX') {
          ui.numpadAppendix = !ui.numpadAppendix;
        } else if (ui.numpadInput.length < 3) {
          ui.numpadInput += key;
        }
        render();
        break;
      }
      case 'numpad-go': {
        const match = numpadMatchingHymn();
        if (match) goToHymn(match.id);
        break;
      }
      case 'numpad-select':
        goToHymn(el.getAttribute('data-id'));
        break;
      case 'clear-numpad-search': {
        ui.drawerSearchQuery = '';
        const inp = document.getElementById('numpad-search-input');
        if (inp) { inp.value = ''; inp.focus(); }
        updateNumpadSearchResults();
        break;
      }
      case 'set-numpad-firstline-sort':
        ui.firstlineSortMode = el.getAttribute('data-mode');
        render();
        break;
      case 'set-drawer-sort':
        ui.drawerSortMode = el.getAttribute('data-mode');
        render();
        break;
      case 'set-font-size':
        setFontSize(el.getAttribute('data-size'));
        break;
      case 'set-bold':
        setBoldText(el.getAttribute('data-bold') === 'true');
        break;
      case 'set-appearance':
        setAppearance(el.getAttribute('data-mode'));
        render();
        break;
    }
  }

  /* ============================================================
     SWIPE NAVIGATION (touch) for reader
  ============================================================ */
  function attachSwipeHandlers() {
    const wrap = document.querySelector('.lyrics-wrap');
    if (!wrap) return;

    let startX = 0, startY = 0, deltaX = 0, tracking = false;

    wrap.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      deltaX = 0;
      tracking = true;
    }, { passive: true });

    wrap.addEventListener('touchmove', (e) => {
      if (!tracking) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy)) {
        deltaX = dx;
      }
    }, { passive: true });

    wrap.addEventListener('touchend', () => {
      if (!tracking) return;
      tracking = false;
      const threshold = 70;
      const hymn = getHymnById(state.currentHymnId);
      if (!hymn) return;
      const allSorted = [...MAIN_HYMNS, ...APPENDIX_HYMNS];
      const idx = allSorted.findIndex(h => h.id === hymn.id);
      const prevHymn = idx > 0 ? allSorted[idx - 1] : null;
      const nextHymn = idx < allSorted.length - 1 ? allSorted[idx + 1] : null;

      if (deltaX > threshold && prevHymn) {
        goToHymn(prevHymn.id, false);
      } else if (deltaX < -threshold && nextHymn) {
        goToHymn(nextHymn.id, false);
      }
      deltaX = 0;
    });
  }

  /* ============================================================
     KEYBOARD NAVIGATION (desktop convenience)
  ============================================================ */
  document.addEventListener('keydown', (e) => {
    if (ui.numpadOpen || ui.drawerOpen || ui.infoOpen) return;
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

    const hymn = getHymnById(state.currentHymnId);
    if (!hymn) return;
    const allSorted = [...MAIN_HYMNS, ...APPENDIX_HYMNS];
    const idx = allSorted.findIndex(h => h.id === hymn.id);

    if (e.key === 'ArrowLeft') {
      const prevHymn = idx > 0 ? allSorted[idx - 1] : null;
      if (prevHymn) goToHymn(prevHymn.id, false);
    } else if (e.key === 'ArrowRight') {
      const nextHymn = idx < allSorted.length - 1 ? allSorted[idx + 1] : null;
      if (nextHymn) goToHymn(nextHymn.id, false);
    }
  });

  /* ============================================================
     INIT
  ============================================================ */
  applyTheme();
  render();
})();
</script>
</body>
</html>
